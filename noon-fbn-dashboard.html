      <div class="panel-head"><h3>Edit Sales Order</h3></div>
      <form class="form" id="editSOForm">
        <div class="field"><label>Sales Order number</label><input type="text" name="newSoNumber" required value="${header?String(header.SONumber).replace(/"/g,'&quot;'):''}"></div>
        <div class="field"><label>Creation date</label><input type="date" name="shipDate" required value="${header?header.ShipDate:''}"></div>
        <div class="field"><label>Expected delivery date</label><input type="date" name="expectedDeliveryDate" value="${header&&header.ExpectedDeliveryDate?header.ExpectedDeliveryDate:''}"></div>
        <div class="field"><label>Delivery location</label><select name="deliveryLocationId">${optionsHtml}</select></div>
        <div class="field"><label>Delivery date</label><input type="date" name="scheduledDate" value="${header&&header.ScheduledDate?header.ScheduledDate:''}"></div>
        <div class="field"><label>POD document</label><div id="editSOPodSection">${editSOPodSectionHtml(pod)}</div>
          <input type="file" id="editSOPodFileInput" accept="image/*,application/pdf" style="display:none;">
          <span class="msg" id="editSOPodMsg" style="display:block;padding-top:6px;"></span>
        </div>
        <div class="form-foot">
          <button class="btn primary" type="submit">Save</button>
          <button class="btn" type="button" id="editSOCancelBtn">Cancel</button>
          <span class="msg" id="editSOMsg"></span>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModalOverlay('editSOOverlay'); };
  document.getElementById('editSOCancelBtn').onclick = () => closeModalOverlay('editSOOverlay');
  const editForm = document.getElementById('editSOForm');
  editForm.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
  });

  const podFileInput = document.getElementById('editSOPodFileInput');
  const podMsg = document.getElementById('editSOPodMsg');
  const wirePodSection = () => {
    const link = document.getElementById('editSOPodViewLink');
    if(link) link.onclick = (e) => { e.preventDefault(); viewPODFile(pod.PodFilePath); };
    document.getElementById('editSOPodReplaceBtn').onclick = () => podFileInput.click();
    const delBtn = document.getElementById('editSOPodDeleteBtn');
    if(delBtn) delBtn.onclick = async () => {
      if(!confirm('Delete the attached POD document? This can\'t be undone.')) return;
      podMsg.className = 'msg'; podMsg.textContent = 'Deleting…';
      try{
        await apiPost('deletePOD', { soNumber: header.SONumber });
        pod.PodFilePath = null; pod.PodFileName = null;
        document.getElementById('editSOPodSection').innerHTML = editSOPodSectionHtml(pod);
        podMsg.className = 'msg ok'; podMsg.textContent = 'Deleted.';
        wirePodSection();
      }catch(e){ podMsg.className = 'msg err'; podMsg.textContent = e.message; }
    };
  };
  wirePodSection();
  podFileInput.onchange = async () => {
    const file = podFileInput.files && podFileInput.files[0];
    if(!file) return;
    podMsg.className = 'msg'; podMsg.textContent = 'Uploading…';
    try{
      const r = await apiPost('attachPOD', { soNumber: header.SONumber, file, attachedBy:'Office', previousPath: pod.PodFilePath || undefined });
      pod.PodFilePath = r.podPath;
      pod.PodFileName = file.name;
      document.getElementById('editSOPodSection').innerHTML = editSOPodSectionHtml(pod);
      podMsg.className = 'msg ok'; podMsg.textContent = 'Saved.';
      wirePodSection();
    }catch(e){ podMsg.className = 'msg err'; podMsg.textContent = e.message; }
    podFileInput.value = '';
  };

  editForm.onsubmit = async (ev) => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const msg = document.getElementById('editSOMsg');
    msg.className='msg'; msg.textContent='Saving…';
    try{
      const r = await apiPost('updateSalesOrder', Object.assign(f, { soNumber: header.SONumber }));
      if(r && r.newSoNumber) state.selectedSO = r.newSoNumber;
      msg.className='msg ok'; msg.textContent='Saved.';
      setTimeout(() => { closeModalOverlay('editSOOverlay'); renderSalesOrderDetail(); }, 400);
    }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
  };
}

async function renderSalesOrderDetail(){
  state.view = 'salesorders'; persistView();
  const soNumber = state.selectedSO;
  const myToken = ++soRenderToken;
  $main.innerHTML = `<div class="view-head"><a href="#" id="backToSO" style="color:var(--blue);font-size:12.5px;text-decoration:none;">← All Sales Orders</a>
    <h2 class="view-title" style="margin-top:8px;">${soNumber}</h2></div>` + panelShell('loading');
  document.getElementById('backToSO').onclick = (e) => { e.preventDefault(); state.selectedSO = null; renderSalesOrders(); };
  try{
    const catalog = await ensureCatalog();
    const [orders, lines] = await Promise.all([apiGet('salesOrder'), apiGet('salesOrderLine')]);
    if(myToken !== soRenderToken) return; // a newer render started while we were fetching — don't append stale panels
    const header = orders.find(o => o.SONumber === soNumber);
    const myLines = lines.filter(l => l.SONumber === soNumber);
    const status = header ? header.Status : '';       // effective/display status
    const rawStatus = header ? header.RawStatus : '';  // stored status (Scheduled stays Scheduled even once it displays as Delivery)
    const isOpen = status === 'Open';
    const isPending = status === 'Pending';
    const isConfirmed = status === 'Confirmed';
    const isScheduledRaw = rawStatus === 'Scheduled'; // covers both "waiting for shipment day" and "showing as Delivery"
    const isDelivery = status === 'Delivery';
    const isInTransit = status === 'In transit';
    // Warehouse can attach the POD document itself (In transit -> POD
    // attached) before the office ever touches this screen; Confirm POD
    // then just needs Delivered qty. Or the office can do both — the POD
    // upload AND Delivered qty — in one motion straight from In transit,
    // never passing through this stage at all. Either path lands on
    // Delivered.
    const isPODAttached = status === 'POD attached';
    const isDelivered = status === 'Delivered';
    const isCompleted = status === 'Completed';
    const isCancelled = status === 'Cancelled';
    // Scheduled delivery / Shipment day only mean anything once "Confirm
    // delivery" has actually run (Scheduled onward) — before that they're
    // just empty fields, so Expected delivery (the rough pre-scheduling
    // estimate) is what's shown instead. Once scheduled, the real date
    // supersedes the estimate, so the two swap rather than both showing.
    const isScheduledOrLater = isScheduledRaw || isInTransit || isPODAttached || isDelivered || isCompleted;
    const deliveredEditableStage = isInTransit || isPODAttached;
    // Confirmed Qty (picking) is editable right on this screen while the
    // order is Pending — the exact same step as the warehouse's Picking
    // screen (same DB write, "updatePickingConfirmation"; whichever side
    // does it first is what counts). Clicking "Confirm" here saves it and
    // advances the order to Confirmed, same as the warehouse's own
    // "Confirm Picking" button.
    const confirmedEditableStage = isPending;
    // Delete only makes sense while the order is still a draft — once
    // Confirm has moved it past Open, deleting a line would desync it from
    // whatever the warehouse/office already started acting on. Add items
    // is now Open-only too (see the isOpen return below), so together
    // there's simply no line-structure editing once the order leaves Open.
    const structLocked = !isOpen;
    // Confirmed qty column only means anything once picking can happen
    // (Pending onward); Delivered qty only means anything once it's
    // actually being entered/exists (In transit onward, same stage
    // deliveredEditableStage turns on) — same "hide until relevant" idea as
    // the PO screen's showConfirmedCol/showReceivedCol.
    const showConfirmedCol = !isOpen;
    // Available qty is captured the moment a line is added (Open) — show it
    // from Open onward, unlike Confirmed/Delivered which only mean
    // something at later stages.
    const showAvailableCol = true;
    const showDeliveredCol = isInTransit || isPODAttached || isDelivered || isCompleted;
    const shortageReasons = ['Stock shortfall - need to investigate','Reserved for another order','Damaged in warehouse','Miscount / data entry error','Other'];

    const enrichedLines = myLines.map(l => {
      // Available qty is a frozen snapshot taken once, when the line was
      // added (Open) — Internal WH On-hand at that moment, floored at 0.
      // It does not track live stock afterwards.
      const availableQty = Number(l.AvailableQty||0);
      const hasConfirmed = l.ConfirmedQty !== null && l.ConfirmedQty !== '' && l.ConfirmedQty !== undefined;
      // Default (nothing confirmed yet) is capped to whatever was available
      // at add-time — never more than that, even if Planned qty asks for
      // more.
      const confirmedVal = hasConfirmed ? Number(l.ConfirmedQty) : Math.min(Number(l.QtySent||0), availableQty);
      const hasDelivered = l.DeliveredQty !== null && l.DeliveredQty !== '' && l.DeliveredQty !== undefined;
      const deliveredVal = hasDelivered ? Number(l.DeliveredQty) : Number(l.EffectiveQty||confirmedVal||0);
      return Object.assign({}, l, { _availableQty: availableQty, _confirmedVal: confirmedVal, _hasConfirmed: hasConfirmed, _deliveredVal: deliveredVal, _hasDelivered: hasDelivered });
    });
    const rowsHtml = enrichedLines.map(l => {
      const c = catalog.find(x => x.zSKU === l.zSKU) || {};
      const short = l._hasConfirmed && Number(l.ConfirmedQty) < Number(l.QtySent||0);
      const confirmedCell = confirmedEditableStage
        ? `<input type="number" class="confirmQtyInput" min="0" value="${l._confirmedVal}" data-original="${l._confirmedVal}" style="width:80px;text-align:center;">`
        : fmt(l._confirmedVal);
      const deliveredCell = deliveredEditableStage
        ? `<input type="number" class="deliveredQtyInput" min="0" value="${l._deliveredVal}" data-original="${l._deliveredVal}" style="width:80px;text-align:center;">`
        : fmt(l._hasDelivered ? l.DeliveredQty : (isDelivered || isCompleted ? l._deliveredVal : null));
      const shortageCell = confirmedEditableStage
        ? `<select class="shortageReasonSelect" data-original="${(l.ShortageReason||'').replace(/"/g,'&quot;')}" style="display:${short?'':'none'};font-size:11.5px;">
            ${shortageReasons.map(r => `<option ${l.ShortageReason===r?'selected':''}>${r}</option>`).join('')}
          </select>`
        : `<span style="font-size:11.5px;color:var(--text-dim);">${l.ShortageReason||''}</span>`;
      const availableShort = Number(l._availableQty||0) < Number(l.QtySent||0);
      // Planned qty is editable while the order's still a draft (Open) —
      // staged locally (no write, no confirm dialog) until "Save" is
      // clicked; same for deleting a line, via the ✕/↺ toggle below.
      const plannedCell = isOpen
        ? `<input type="number" class="plannedQtyInput" min="0" value="${l.QtySent}" data-original="${l.QtySent}" style="width:80px;text-align:center;">`
        : fmt(l.QtySent);
      return `
      <tr data-linenum="${l.LineNum}"><td class="sku">${c.SKU||''}</td><td>${barcodeItemLabel(l.zSKU, catalog)}</td>
        <td class="num">${plannedCell}</td>
        ${showAvailableCol ? `<td class="num"${availableShort?' style="color:var(--amber);"':''}>${fmt(l._availableQty)}</td>` : ''}
        <td class="num">${fmt(l.SellingPrice)}</td><td class="num">${fmt(l.LineTotal)}</td>
        ${showConfirmedCol ? `<td class="num">${confirmedCell}</td>` : ''}
        ${showDeliveredCol ? `<td class="num">${deliveredCell}</td>` : ''}
        <td>${shortageCell}</td>
        <td>${structLocked ? '' : `<button type="button" class="btn deleteLineToggleBtn" data-linenum="${l.LineNum}" style="color:var(--red);" title="Delete this line">✕</button>`}</td></tr>`;
    }).join('');

    const totalPlannedQty = enrichedLines.reduce((s,l) => s + Number(l.QtySent||0), 0);
    const totalPlannedValue = enrichedLines.reduce((s,l) => s + Number(l.LineTotal||0), 0);
    const totalAvailableQty = enrichedLines.reduce((s,l) => s + Number(l._availableQty||0), 0);
    const totalConfirmedQty = enrichedLines.reduce((s,l) => s + Number(l._confirmedVal||0), 0);
    const totalConfirmedValue = enrichedLines.reduce((s,l) => s + Number(l._confirmedVal||0) * Number(l.SellingPrice||0), 0);
    const totalDeliveredQty = enrichedLines.reduce((s,l) => s + Number(l._deliveredVal||0), 0);
    const totalDeliveredValue = enrichedLines.reduce((s,l) => s + Number(l._deliveredVal||0) * Number(l.SellingPrice||0), 0);

    const statusActions = [];
    if(isOpen) statusActions.push({ id:'confirmOpenBtn', label:'Confirm', primary:true, to:'Pending', confirmMsg:'Confirm this Sales Order and move it to Pending?' });
    if(isPending){
      statusActions.push({ id:'confirmPendingBtn', label:'Confirm', primary:true, to:'Confirmed', pick:true, confirmMsg:'Confirm picking and move this Sales Order to Confirmed?' });
      statusActions.push({ id:'backToOpenSOBtn', label:'Back to Open', primary:false, to:'Open', confirmMsg:'Move this Sales Order back to Open?' });
    }
    if(isConfirmed){
      statusActions.push({ id:'confirmDeliveryBtn', label:'Confirm delivery', primary:true, schedule:true });
      statusActions.push({ id:'backToPendingSOBtn', label:'Back to Pending', primary:false, to:'Pending', confirmMsg:'Move this Sales Order back to Pending? Confirmed qty becomes editable again.' });
    }
    if(isScheduledRaw) statusActions.push({ id:'backToConfirmedSOBtn', label:'Back to Confirmed', primary:false, to:'Confirmed', confirmMsg:'Move this Sales Order back to Confirmed? Its scheduled date stays on file if you confirm delivery again.' });
    if(isInTransit){
      // No POD on file yet — Confirm POD collects the document itself
      // (required) alongside Delivered qty, and goes straight to Delivered
      // in one step (skipping "POD attached" entirely).
      statusActions.push({ id:'confirmPODBtn', label:'Confirm POD', primary:true, to:'Delivered', pod:true, podNeedsFile:true });
      statusActions.push({ id:'backToScheduledSOBtn', label:'Back to Delivery', primary:false, to:'Scheduled', confirmMsg:'Move this Sales Order back to Delivery? This undoes dispatch.' });
    }
    if(isPODAttached){
      // Warehouse already attached the document — Confirm POD here only
      // needs Delivered qty.
      statusActions.push({ id:'confirmPODBtn', label:'Confirm POD', primary:true, to:'Delivered', pod:true, confirmMsg:'Confirm proof of delivery and mark this Sales Order Delivered?' });
      statusActions.push({ id:'backToInTransitPODSOBtn', label:'Back to In transit', primary:false, to:'In transit', confirmMsg:'Move this Sales Order back to In transit?' });
    }
    if(isDelivered){
      // Back up to wherever it actually came from: if a POD is already on
      // file, that's "POD attached" (undoing this doesn't lose the
      // document); otherwise it's plain "In transit".
      const deliveredBackStatus = header && header.PodFilePath ? 'POD attached' : 'In transit';
      statusActions.push({ id:'completeSOBtn', label:'Complete', primary:true, to:'Completed', confirmMsg:'Mark this Sales Order as Completed? This is its final stage.' });
      statusActions.push({ id:'backToInTransitSOBtn', label:`Back to ${deliveredBackStatus}`, primary:false, to:deliveredBackStatus, confirmMsg:`Move this Sales Order back to ${deliveredBackStatus}? This undoes proof of delivery.` });
    }
    if(isCompleted) statusActions.push({ id:'backToDeliveredSOBtn', label:'Back to Delivered', primary:false, to:'Delivered', confirmMsg:'Move this Sales Order back to Delivered?' });
    const canCancel = !isCancelled && !isCompleted;

    setPanel(`
      <div class="panel-head"><h3>Sales Order - Summary</h3>
        <div style="display:flex;gap:8px;">
          ${statusActions.map(a => `<button class="btn${a.primary?' primary':''}" id="${a.id}">${a.label}</button>`).join('')}
          ${canCancel ? `<button class="btn" id="cancelSOBtn" style="border-color:var(--red);color:var(--red);">Cancel order</button>` : ''}
        </div></div>
      <div class="batch-bar" style="flex-wrap:wrap;"><label>Creation date</label><span>${header?header.ShipDate:''}</span>
        ${!isScheduledOrLater ? `<label>Expected delivery</label><span>${header&&header.ExpectedDeliveryDate?header.ExpectedDeliveryDate:'—'}</span>` : ''}
        <label>Delivery location</label><span>${header&&header.DeliveryLocationName?header.DeliveryLocationName:'—'}</span>
        ${!isOpen && isScheduledOrLater ? `<label>Scheduled delivery</label><span>${header&&header.ScheduledDate?header.ScheduledDate:'—'}</span>
        <label>Shipment day</label><span>${header&&header.ShipmentDay?header.ShipmentDay:'—'}</span>` : ''}
        ${(isPODAttached || isDelivered || isCompleted) ? `<label>POD</label><span>${header&&header.PodFilePath
          ? `<a href="#" id="viewPODLink">${header.PodFileName||'View document'}</a> <span style="color:var(--text-dim);font-size:11.5px;">(${header.PodAttachedBy||''}${header.PodAttachedAt?', '+new Date(header.PodAttachedAt).toLocaleString():''})</span>`
          : '—'}</span>` : ''}
        <label>Status</label><span>${soStatusChip(status)}</span>
        <label>Expected sellable</label><span>${header?header.ExpectedSellableDate:''}</span>
        <button class="btn" id="editSOBtn" style="margin-left:auto;">Edit</button></div>
    `);

    const cancelBtn = document.getElementById('cancelSOBtn');
    if(cancelBtn) cancelBtn.onclick = async () => {
      if(!confirm(`Cancel ${soNumber}? All its stock will return to Internal WH automatically.`)) return;
      try{ await apiPost('cancelSalesOrder', { soNumber }); renderSalesOrderDetail(); }
      catch(e){ alert('Could not cancel: ' + e.message); }
    };
    document.getElementById('editSOBtn').onclick = () => openEditSOModal(header);
    const viewPODLink = document.getElementById('viewPODLink');
    if(viewPODLink) viewPODLink.onclick = (e) => { e.preventDefault(); viewPODFile(header.PodFilePath); };

    statusActions.forEach(a => {
      const btn = document.getElementById(a.id);
      if(!btn) return;
      btn.onclick = async () => {
        if(a.schedule){
          openScheduleDeliveryModal(header && header.ScheduledDate, header && header.DeliveryLocationId, async (scheduledDate, deliveryLocationId) => {
            btn.disabled = true;
            try{ await apiPost('scheduleSODelivery', { soNumber, scheduledDate, deliveryLocationId }); renderSalesOrderDetail(); }
            catch(e){ alert(e.message); btn.disabled = false; }
          });
          return;
        }
        if(a.pod && a.podNeedsFile){
          // No POD on file yet — collect the document itself, then fold
          // straight into the same Delivered qty write + status move the
          // plain a.pod path below does (see the a.pod block further down).
          openAttachPODModal(async (file) => {
            btn.disabled = true;
            try{
              await apiPost('attachPOD', { soNumber, file, attachedBy:'Office' });
              for(const l of enrichedLines){
                const row = document.querySelector(`tr[data-linenum="${l.LineNum}"]`);
                const inp = row ? row.querySelector('.deliveredQtyInput') : null;
                const shownVal = inp ? Number(inp.value||0) : l._deliveredVal;
                if(!l._hasDelivered || Number(l.DeliveredQty) !== shownVal){
                  await apiPost('updateSODeliveredQty', { soNumber, lineNum: l.LineNum, deliveredQty: shownVal });
                }
              }
              await apiPost('setSOStatus', { soNumber, status: a.to });
              renderSalesOrderDetail();
            }catch(e){ alert(e.message); btn.disabled = false; }
          });
          return;
        }
        const dirtyLineEdit = Array.from(document.querySelectorAll('.deliveredQtyInput, .confirmQtyInput'))
          .some(inp => !inp.disabled && inp.value !== inp.dataset.original);
        if(dirtyLineEdit && !a.pod && !a.pick){
          alert('You have unsaved Confirmed/Delivered qty changes. Click "Confirm" (or "Confirm POD") to save them, or refresh to discard.');
          return;
        }
        const dirtyPlannedEdit = Array.from(document.querySelectorAll('.plannedQtyInput')).some(inp => inp.value !== inp.dataset.original)
          || !!document.querySelector('tr.pending-delete');
        if(dirtyPlannedEdit){
          alert('You have unsaved Planned qty/delete changes on the line items below. Click "Save" or "Cancel" there first.');
          return;
        }
        if(!confirm(a.confirmMsg)) return;
        btn.disabled = true;
        try{
          if(a.pick){
            // Same action as the warehouse's Picking screen — writes
            // confirmed_qty (+ shortage reason) for every line via the
            // shared updatePickingConfirmation call, then advances status.
            for(const l of enrichedLines){
              const row = document.querySelector(`tr[data-linenum="${l.LineNum}"]`);
              const inp = row ? row.querySelector('.confirmQtyInput') : null;
              const sel = row ? row.querySelector('.shortageReasonSelect') : null;
              const shownVal = inp ? Number(inp.value||0) : l._confirmedVal;
              const shownReason = sel && sel.style.display !== 'none' ? sel.value : '';
              if(!l._hasConfirmed || Number(l.ConfirmedQty) !== shownVal || (l.ShortageReason||'') !== shownReason){
                await apiPost('updatePickingConfirmation', { soNumber, lineNum: l.LineNum, confirmedQty: shownVal, shortageReason: shownReason });
              }
            }
          }
          if(a.pod){
            // Same display-fallback pattern used for Confirmed/Received qty
            // elsewhere: the Delivered qty column defaults to Effective qty
            // for display, but that default is never written unless the
            // field was manually edited — Confirm POD is the moment it needs
            // to actually land in delivered_qty for every line.
            for(const l of enrichedLines){
              const row = document.querySelector(`tr[data-linenum="${l.LineNum}"]`);
              const inp = row ? row.querySelector('.deliveredQtyInput') : null;
              const shownVal = inp ? Number(inp.value||0) : l._deliveredVal;
              if(!l._hasDelivered || Number(l.DeliveredQty) !== shownVal){
                await apiPost('updateSODeliveredQty', { soNumber, lineNum: l.LineNum, deliveredQty: shownVal });
              }
            }
          }
          await apiPost('setSOStatus', { soNumber, status: a.to }); renderSalesOrderDetail();
        }catch(e){ alert(e.message); btn.disabled = false; }
      };
    });

    // "Recheck stock" re-captures Available qty for every not-yet-confirmed
    // line in one go, against Internal WH stock as it stands right now —
    // useful if stock arrived (or moved) after these lines were added.
    // Once Confirmed qty is locked in, rechecking no longer means anything,
    // so lines past that point are left untouched.
    const recaptureLines = enrichedLines.filter(l => !l._hasConfirmed);
    const linesPanel = document.createElement('div');
    linesPanel.className = 'panel';
    linesPanel.innerHTML = `
      <div class="panel-head"><h3>${myLines.length} line item(s)</h3>
        <div style="display:flex;gap:8px;">
        <button class="btn" id="saveLineEditsBtn" style="display:none;color:var(--blue);">Save</button>
        <button class="btn" id="cancelLineEditsBtn" style="display:none;">Cancel</button>
        ${recaptureLines.length ? `<button class="btn" id="recaptureAllBtn" title="Re-check current Internal WH stock and refresh Available qty for every not-yet-confirmed line">↻ Recheck stock</button>` : ''}
        ${myLines.length ? exportBtnHtml('soExportBtn','Export lines') : ''}
        </div></div>
      ${myLines.length ? `<table><thead><tr><th>SKU</th><th>Item name</th><th class="num">Planned</th>${showAvailableCol ? '<th class="num">Available</th>' : ''}<th class="num">Selling price</th><th class="num">Line total</th>${showConfirmedCol ? '<th class="num">Confirmed</th>' : ''}${showDeliveredCol ? '<th class="num">Delivered</th>' : ''}<th>Shortage reason</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
        <div class="batch-bar" style="flex-wrap:wrap;border-top:1px solid var(--border);font-weight:600;">
          <label>Total planned qty</label><span>${fmt(totalPlannedQty)}</span>
          <label>Value</label><span>${fmt(totalPlannedValue)}</span>
          ${showAvailableCol ? `<span style="color:var(--text-faint);font-weight:400;">|</span>
          <label>Total available qty</label><span>${fmt(totalAvailableQty)}</span>` : ''}
          ${showConfirmedCol ? `<span style="color:var(--text-faint);font-weight:400;">|</span>
          <label>Total confirmed qty</label><span>${fmt(totalConfirmedQty)}</span>
          <label>Value</label><span>${fmt(totalConfirmedValue)}</span>` : ''}
          ${showDeliveredCol ? `<span style="color:var(--text-faint);font-weight:400;">|</span>
          <label>Total delivered qty</label><span>${fmt(totalDeliveredQty)}</span>
          <label>Value</label><span>${fmt(totalDeliveredValue)}</span>` : ''}
        </div>` : emptyState('No items yet — add one below or import a file.')}`;
    document.getElementById('main').appendChild(linesPanel);
    const soExportBtn = document.getElementById('soExportBtn');
    if(soExportBtn) soExportBtn.onclick = () => exportRows(myLines, `${soNumber}-lines.xlsx`, soNumber);
    if(confirmedEditableStage){
      document.querySelectorAll('.confirmQtyInput').forEach(inp => {
        const row = inp.closest('tr');
        const planned = Number(row.dataset.linenum ? (enrichedLines.find(l => String(l.LineNum)===row.dataset.linenum)||{}).QtySent : 0);
        inp.oninput = () => {
          const sel = row.querySelector('.shortageReasonSelect');
          if(sel) sel.style.display = Number(inp.value) < planned ? '' : 'none';
        };
      });
    }
    // Planned qty edits and line deletes (Open only) are staged locally —
    // no per-click confirm dialog, no write — until "Save" is clicked;
    // "Cancel" puts every row back exactly as it was. saveLineEditsBtn /
    // cancelLineEditsBtn only show up once something's actually dirty.
    const saveLineEditsBtn = document.getElementById('saveLineEditsBtn');
    const cancelLineEditsBtn = document.getElementById('cancelLineEditsBtn');
    const checkLineDirty = () => {
      const dirty = Array.from(document.querySelectorAll('.plannedQtyInput')).some(inp => inp.value !== inp.dataset.original)
        || !!document.querySelector('tr.pending-delete');
      if(saveLineEditsBtn) saveLineEditsBtn.style.display = dirty ? '' : 'none';
      if(cancelLineEditsBtn) cancelLineEditsBtn.style.display = dirty ? '' : 'none';
      return dirty;
    };
    document.querySelectorAll('.plannedQtyInput').forEach(inp => {
      inp.oninput = checkLineDirty;
    });
    document.querySelectorAll('.deleteLineToggleBtn').forEach(btn => {
      btn.onclick = () => {
        const row = btn.closest('tr');
        const pending = row.classList.toggle('pending-delete');
        row.style.opacity = pending ? '0.4' : '';
        row.style.textDecoration = pending ? 'line-through' : '';
        const plannedInp = row.querySelector('.plannedQtyInput');
        if(plannedInp) plannedInp.disabled = pending;
        btn.textContent = pending ? '↺' : '✕';
        btn.title = pending ? 'Undo delete' : 'Delete this line';
        checkLineDirty();
      };
    });
    if(cancelLineEditsBtn) cancelLineEditsBtn.onclick = () => {
      document.querySelectorAll('tr.pending-delete').forEach(row => {
        row.classList.remove('pending-delete');
        row.style.opacity = ''; row.style.textDecoration = '';
        const plannedInp = row.querySelector('.plannedQtyInput');
        if(plannedInp) plannedInp.disabled = false;
        const toggleBtn = row.querySelector('.deleteLineToggleBtn');
        if(toggleBtn){ toggleBtn.textContent = '✕'; toggleBtn.title = 'Delete this line'; }
      });
      document.querySelectorAll('.plannedQtyInput').forEach(inp => { inp.value = inp.dataset.original; });
      checkLineDirty();
    };
    if(saveLineEditsBtn) saveLineEditsBtn.onclick = async () => {
      saveLineEditsBtn.disabled = true; if(cancelLineEditsBtn) cancelLineEditsBtn.disabled = true;
      saveLineEditsBtn.textContent = 'Saving…';
      try{
        const rows = Array.from(document.querySelectorAll('tr[data-linenum]'));
        for(const row of rows){
          const lineNum = row.dataset.linenum;
          if(row.classList.contains('pending-delete')){
            await apiPost('deleteSalesOrderLine', { soNumber, lineNum });
            continue;
          }
          const inp = row.querySelector('.plannedQtyInput');
          if(inp && inp.value !== inp.dataset.original){
            await apiPost('updateSOLineQtySent', { soNumber, lineNum, qtySent: inp.value });
          }
        }
        renderSalesOrderDetail();
      }catch(e){ alert(e.message); saveLineEditsBtn.disabled = false; saveLineEditsBtn.textContent = 'Save'; if(cancelLineEditsBtn) cancelLineEditsBtn.disabled = false; }
    };
    const recaptureAllBtn = document.getElementById('recaptureAllBtn');
    if(recaptureAllBtn){
      recaptureAllBtn.onclick = async () => {
        recaptureAllBtn.disabled = true; recaptureAllBtn.textContent = 'Rechecking…';
        try{
          for(const l of recaptureLines){
            await apiPost('recaptureAvailableQty', { soNumber, lineNum: l.LineNum });
          }
          renderSalesOrderDetail();
        }catch(e){ alert(e.message); recaptureAllBtn.disabled = false; recaptureAllBtn.textContent = '↻ Recheck stock'; }
      };
    }

    if(!isOpen){ return; } // "Add items" only applies to a draft (Open) order — once Confirm has moved it on, items are locked in and edited via the line table itself

    const itemOptionsHtml = catalog.map(c => `<option value="${c.SKU}" label="${(c.ItemName||'').replace(/"/g,'&quot;')}">`).join('');

    const addPanel = document.createElement('div');
    addPanel.className = 'panel';
    addPanel.innerHTML = `
      <div class="panel-head"><h3>Add items</h3>
        <button class="btn" id="soShowImportBtn">Import items</button></div>
      <table id="soAddItemsTable">
        <thead><tr><th>Item (zSKU, SKU or barcode)</th><th class="num">Qty sent</th><th></th></tr></thead>
        <tbody id="soAddItemsBody">
          <tr class="soAddRow">
            <td><input type="text" class="soItemInput" list="soItemOptions" placeholder="Type or pick an item" autocomplete="off" style="width:100%;">
              <span class="msg err soRowErr" style="display:none;">Item not found</span></td>
            <td class="num"><input type="number" class="soQtyInput" min="1" style="width:90px;text-align:right;"></td>
            <td><button type="button" class="btn soRemoveRowBtn" style="display:none;" title="Remove row">✕</button></td>
          </tr>
        </tbody>
      </table>
      <datalist id="soItemOptions">${itemOptionsHtml}</datalist>
      <div class="form-foot" style="padding:12px 16px;">
        <button class="btn primary" id="soAddItemsBtn">Add items</button>
        <span class="msg" id="soLineMsg"></span>
      </div>`;
    document.getElementById('main').appendChild(addPanel);

    const addBody = document.getElementById('soAddItemsBody');
    function newRow(){
      const tr = document.createElement('tr');
      tr.className = 'soAddRow';
      tr.innerHTML = `
        <td><input type="text" class="soItemInput" list="soItemOptions" placeholder="Type or pick an item" autocomplete="off" style="width:100%;">
          <span class="msg err soRowErr" style="display:none;">Item not found</span></td>
        <td class="num"><input type="number" class="soQtyInput" min="1" style="width:90px;text-align:right;"></td>
        <td><button type="button" class="btn soRemoveRowBtn" title="Remove row">✕</button></td>`;
      wireRow(tr);
      return tr;
    }
    function wireRow(tr){
      const itemInput = tr.querySelector('.soItemInput');
      const qtyInput = tr.querySelector('.soQtyInput');
      const removeBtn = tr.querySelector('.soRemoveRowBtn');
      const maybeGrow = () => {
        const isLast = tr === addBody.lastElementChild;
        if(isLast && itemInput.value.trim() && qtyInput.value){
          addBody.appendChild(newRow());
        }
      };
      itemInput.addEventListener('input', maybeGrow);
      qtyInput.addEventListener('input', maybeGrow);
      removeBtn.onclick = () => { if(addBody.children.length > 1) tr.remove(); };
    }
    wireRow(addBody.querySelector('.soAddRow'));

    document.getElementById('soAddItemsBtn').onclick = async () => {
      const msg = document.getElementById('soLineMsg');
      document.querySelectorAll('.soRowErr').forEach(e => e.style.display = 'none');
      document.querySelectorAll('.soItemInput').forEach(i => i.style.borderColor = '');
      const items = [];
      let hadError = false;
      addBody.querySelectorAll('.soAddRow').forEach(tr => {
        const itemInput = tr.querySelector('.soItemInput');
        const qtyInput = tr.querySelector('.soQtyInput');
        const raw = itemInput.value.trim();
        if(!raw && !qtyInput.value) return; // blank trailing row — ignore
        const zsku = resolveZsku(raw, catalog);
        if(!zsku){
          hadError = true;
          itemInput.style.borderColor = 'var(--red)';
          tr.querySelector('.soRowErr').style.display = '';
          return;
        }
        const qty = Number(qtyInput.value || 0);
        if(!raw || qty <= 0) return;
        items.push({ zsku, qtySent: qty });
      });
      if(hadError){ msg.className = 'msg err'; msg.textContent = 'Fix the highlighted item(s) — not found in the catalog.'; return; }
      if(!items.length){ msg.className = 'msg err'; msg.textContent = 'Enter at least one item with a qty.'; return; }
      msg.className='msg'; msg.textContent='Saving…';
      try{
        await apiPost('addSalesOrderBatch', { soNumber, shipDate: header?header.ShipDate:today(), items });
        renderSalesOrderDetail();
      }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
    };

    document.getElementById('soShowImportBtn').onclick = () => openSOImportModal(soNumber, header, catalog);
  }catch(e){ setPanel(errorState(e)); }
}

function openSOImportModal(soNumber, header, catalog){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'soImportOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="panel-head"><h3>Import items</h3>
        <div style="display:flex;gap:8px;">
          ${templateBtnHtml('soTemplateBtn')}
          <button class="btn" id="soImportCloseBtn">Close</button>
        </div></div>
      <div class="importzone" id="soImportDrop">Click to choose a file — columns ZSKU, QTY
        <input type="file" id="soImportFile" accept=".xlsx,.xls,.csv">
      </div>
      <div id="soImportBody"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModalOverlay('soImportOverlay'); };
  document.getElementById('soImportCloseBtn').onclick = () => closeModalOverlay('soImportOverlay');
  document.getElementById('soTemplateBtn').onclick = () => downloadTemplate(['zSKU','SKU','Barcode','QTY'], `${soNumber}-import-template.xlsx`);
  document.getElementById('soImportDrop').onclick = () => document.getElementById('soImportFile').click();
  document.getElementById('soImportFile').onchange = async (ev) => {
    const file = ev.target.files[0];
    if(!file) return;
    const body = document.getElementById('soImportBody');
    body.innerHTML = '<div class="loading">parsing…</div>';
    try{
      const wb = await readFileAsWorkbook(file);
      const parsed = sheetRows(wb);
      if(!parsed.length) throw new Error('No rows found.');
      const headers = Object.keys(parsed[0]);
      const findExact = (name) => headers.find(h => h.toLowerCase().trim() === name);
      const zskuCol = findExact('zsku') || headers.find(h => h.toLowerCase().includes('sku'));
      const qtyCol = findExact('qty') || headers.find(h => h.toLowerCase().includes('qty'));
      const items = [];
      let unmatched = 0;
      parsed.forEach(r => {
        const z = resolveZsku(r[zskuCol], catalog);
        if(!z){ unmatched++; return; }
        items.push({ zsku: z, qtySent: Number(r[qtyCol]||0) });
      });
      body.innerHTML = `<div class="batch-bar">
        <span class="msg">${items.length} row(s) recognized${unmatched?`, ${unmatched} unmatched`:''}.</span>
        <button class="btn primary" id="soImportBtn">Import</button>
        <span class="msg" id="soImportMsg"></span></div>`;
      document.getElementById('soImportBtn').onclick = async () => {
        const msg = document.getElementById('soImportMsg');
        msg.className='msg'; msg.textContent='Saving…';
        try{
          const r = await apiPostBatched('addSalesOrderBatch', items,
            { soNumber, shipDate: header?header.ShipDate:today() }, 'linesAdded',
            (done,of) => { if(of>1){ msg.textContent = `Saving batch ${done}/${of}…`; } });
          closeModalOverlay('soImportOverlay');
          renderSalesOrderDetail();
        }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
      };
    }catch(e){ body.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`; }
  };
}

const PO_STATUSES = ['Open','RFQ','Purchase Order','Received','Validated','Cancelled'];

async function renderPurchaseOrders(){
  state.view = 'purchaseorders'; state.selectedPO = null; persistView();
  $main.innerHTML = viewHead('Purchase Orders', 'Orders placed with your suppliers to restock Internal WH. Click one to view or add its items.') + panelShell('loading');
  try{
    const rows = await apiGet('purchaseOrder');
    // Newest Creation date first — same reasoning as the Sales Orders list.
    const sorted = rows.slice().sort((a, b) => (b.PODate||'').localeCompare(a.PODate||''));
    const statusOptionsHtml = `<option value="">All statuses</option>` + PO_STATUSES.map(s => `<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('');

    const renderRows = (list) => {
      const body = list.length ? list.map(r => `
        <tr class="clickRow" data-po="${r.PONumber}">
          <td class="sku">${r.PONumber}</td><td>${r.QuotationNumber||'—'}</td><td>${r.InvoiceNumber||'—'}</td>
          <td>${r.PODate||''}</td><td>${r.ReceivedDate||'—'}</td><td>${r.Supplier||''}</td>
          <td class="num">${fmt(r.TotalUnits)}</td><td class="num">${fmt(r.TotalCost)}</td><td>${poStatusChip(r.Status)}</td>
        </tr>`).join('') : `<tr><td colspan="9">${emptyState('No purchase orders match this filter.')}</td></tr>`;
      const tbody = document.getElementById('poListBody');
      if(tbody) tbody.innerHTML = body;
      document.querySelectorAll('tr.clickRow[data-po]').forEach(tr => {
        tr.style.cursor = 'pointer';
        tr.onclick = () => { state.selectedPO = tr.dataset.po; renderPurchaseOrderDetail(); };
      });
    };

    setPanel(`
      <div class="panel-head"><h3>${rows.length} order${rows.length===1?'':'s'}</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn primary" id="newPOBtn">Create new Purchase Order</button>
          <button class="btn" onclick="refreshAll()">Refresh</button>
        </div></div>
      ${rows.length ? `
      <div class="panel-head" style="flex-wrap:wrap;gap:10px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="text" id="poSearchInput" placeholder="Search PO / Quotation / Invoice #…" style="width:240px;">
          <select id="poStatusFilter">${statusOptionsHtml}</select>
        </div>
      </div>
      <table>
        <thead><tr><th>PO</th><th>Quotation #</th><th>Invoice #</th><th>Creation date</th><th>Received date</th><th>Supplier</th><th class="num">Units</th><th class="num">Cost</th><th>Status</th></tr></thead>
        <tbody id="poListBody"></tbody></table>` : emptyState('No purchase orders yet — click "Create new Purchase Order" above.')}
    `);

    if(rows.length){
      const searchInput = document.getElementById('poSearchInput');
      const statusFilter = document.getElementById('poStatusFilter');
      const applyFilter = () => {
        const q = searchInput.value.trim().toLowerCase();
        const statusVal = statusFilter.value;
        // No status picked: everything except Cancelled (hidden by
        // default). Picking "Cancelled" explicitly is the only way to see
        // cancelled orders; picking any other status filters to just that.
        let list = statusVal ? sorted.filter(r => r.Status === statusVal) : sorted.filter(r => r.Status !== 'Cancelled');
        if(q) list = list.filter(r =>
          (r.PONumber||'').toLowerCase().includes(q) ||
          (r.QuotationNumber||'').toLowerCase().includes(q) ||
          (r.InvoiceNumber||'').toLowerCase().includes(q));
        renderRows(list);
      };
      searchInput.oninput = applyFilter;
      statusFilter.onchange = applyFilter;
      applyFilter();
    }

    document.getElementById('newPOBtn').onclick = openCreatePOModal;
  }catch(e){ setPanel(errorState(e)); }
}

async function openCreatePOModal(){
  const [nextNum, supplierRows] = await Promise.all([
    apiGet('nextPONumber').catch(() => ({number:''})),
    ensureSuppliers()
  ]);
  const suppliers = activeSupplierNames(supplierRows);
  const leadTimeByName = new Map(supplierRows.map(s => [s.Name, s.LeadTimeWeeks]));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'createPOOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="panel-head"><h3>Create a new Purchase Order</h3></div>
      <form class="form" id="newPOForm">
        <div class="field"><label>PO number</label><input type="text" name="poNumber" value="${nextNum.number||''}" required></div>
        <div class="field"><label>PO date</label><input type="date" name="poDate" value="${today()}" required></div>
        <div class="field"><label>Supplier</label>
          <input type="text" name="supplier" id="poSupplierInput" list="poSupplierList" placeholder="Type or pick a supplier" autocomplete="off">
          <datalist id="poSupplierList">${suppliers.map(s => `<option value="${s.replace(/"/g,'&quot;')}">`).join('')}</datalist>
          <span class="msg err" id="poSupplierErr" style="display:none;">Invalid Supplier</span>
        </div>
        <div class="field"><label>Expected delivery</label>
          <input type="date" name="expectedDelivery">
        </div>
        <div class="field span2" style="font-size:11.5px;color:var(--text-dim);">
          Leave Expected delivery blank to auto-fill it from PO date + that supplier's lead time (set on the Suppliers page), or the standard planner lead time if the supplier has none set.
        </div>
        <div class="form-foot">
          <button class="btn primary" type="submit">Create & open</button>
          <button class="btn" type="button" id="createPOCancelBtn">Cancel</button>
          <span class="msg" id="newPOMsg"></span>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModalOverlay('createPOOverlay'); };
  document.getElementById('createPOCancelBtn').onclick = () => closeModalOverlay('createPOOverlay');
  const poForm = document.getElementById('newPOForm');
  const supplierInput = document.getElementById('poSupplierInput');
  const supplierErr = document.getElementById('poSupplierErr');
  const supplierLower = new Map(suppliers.map(s => [s.toLowerCase(), s]));
  function validateSupplier(){
    const v = supplierInput.value.trim();
    if(!v){ supplierErr.style.display = 'none'; supplierInput.style.borderColor = ''; return true; }
    const match = supplierLower.get(v.toLowerCase());
    if(!match){ supplierErr.style.display = ''; supplierInput.style.borderColor = 'var(--red)'; return false; }
    supplierInput.value = match; // normalize casing to the real supplier name
    supplierErr.style.display = 'none'; supplierInput.style.borderColor = '';
    return true;
  }
  supplierInput.addEventListener('blur', validateSupplier);
  supplierInput.addEventListener('input', () => { if(supplierErr.style.display !== 'none') validateSupplier(); });
  // Enter key inside a text field shouldn't submit the form — only the
  // "Create & open" button should. But Enter is also the natural way people
  // try to "confirm" the supplier field, so run validation right here too —
  // otherwise pressing Enter on a bad supplier just does nothing and looks
  // like the error message is broken.
  poForm.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if(e.target === supplierInput) validateSupplier();
  });
  document.getElementById('newPOForm').onsubmit = async (ev) => {
    ev.preventDefault();
    if(!validateSupplier()){ supplierInput.focus(); return; }
    const f = Object.fromEntries(new FormData(ev.target));
    const msg = document.getElementById('newPOMsg');
    msg.className='msg'; msg.textContent='Creating…';
    try{
      if(!f.expectedDelivery){
        const supplierWeeks = f.supplier ? leadTimeByName.get(f.supplier) : null;
        let weeks = Number(supplierWeeks);
        if(!weeks){ const settings = await getSettings(); weeks = Number(settings.supplier_lead_time_weeks || 3); }
        f.expectedDelivery = addDays(f.poDate, weeks * 7);
      }
      await apiPost('createPurchaseOrder', f);
      state.selectedPO = f.poNumber;
      closeModalOverlay('createPOOverlay');
      renderPurchaseOrderDetail();
    }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
  };
}

// "Edit" on the PO Order summary panel — same pattern as the Sales Order
// screen's Edit button: one modal for every header field instead of
// inline-editable spans. The per-field stage restrictions from before
// (PO number only in Open, Quotation # only in RFQ, Invoice # only from
// Purchase Order onward) are still enforced server-side by their
// respective apiPost cases and surface here as the same friendly errors.
// Saves are sequential and stop at the first error, so anything already
// saved (e.g. a rename) sticks even if a later field is rejected.
function openEditPOModal(header, poNumber){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'editPOOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="panel-head"><h3>Edit Purchase Order</h3></div>
      <form class="form" id="editPOForm">
        <div class="field"><label>PO number</label><input type="text" name="newPoNumber" required value="${poNumber.replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Date</label><input type="date" name="poDate" required value="${header?header.PODate:''}"></div>
        <div class="field"><label>Quotation number</label><input type="text" name="quotationNumber" value="${((header&&header.QuotationNumber)||'').replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Expected receiving date</label><input type="date" name="expectedReceivingDate" value="${(header&&header.ExpectedReceivingDate)||''}"></div>
        <div class="field"><label>Invoice number</label><input type="text" name="invoiceNumber" value="${((header&&header.InvoiceNumber)||'').replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Received date</label><input type="date" name="receivedDate" value="${(header&&header.ReceivedDate)||''}"></div>
        <div class="form-foot">
          <button class="btn primary" type="submit">Save</button>
          <button class="btn" type="button" id="editPOCancelBtn">Cancel</button>
          <span class="msg" id="editPOMsg"></span>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModalOverlay('editPOOverlay'); };
  document.getElementById('editPOCancelBtn').onclick = () => closeModalOverlay('editPOOverlay');
  const editForm = document.getElementById('editPOForm');
  editForm.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
  });
  editForm.onsubmit = async (ev) => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const msg = document.getElementById('editPOMsg');
    msg.className='msg'; msg.textContent='Saving…';
    let currentPoNumber = poNumber;
    try{
      const newNumber = (f.newPoNumber||'').trim();
      if(newNumber !== currentPoNumber){
        const r = await apiPost('renamePurchaseOrder', { poNumber: currentPoNumber, newPoNumber: newNumber });
        currentPoNumber = r.newPoNumber;
        state.selectedPO = currentPoNumber;
      }
      if(f.poDate !== (header?header.PODate:'')){
        await apiPost('updatePODate', { poNumber: currentPoNumber, value: f.poDate });
      }
      if((f.quotationNumber||'').trim() !== ((header&&header.QuotationNumber)||'')){
        await apiPost('updatePOQuotationNumber', { poNumber: currentPoNumber, value: (f.quotationNumber||'').trim() });
      }
      if((f.expectedReceivingDate||'') !== ((header&&header.ExpectedReceivingDate)||'')){
        await apiPost('updatePOExpectedReceivingDate', { poNumber: currentPoNumber, value: f.expectedReceivingDate || null });
      }
      if((f.invoiceNumber||'').trim() !== ((header&&header.InvoiceNumber)||'')){
        await apiPost('updatePOInvoiceNumber', { poNumber: currentPoNumber, value: (f.invoiceNumber||'').trim() });
      }
      if((f.receivedDate||'') !== ((header&&header.ReceivedDate)||'')){
        await apiPost('updatePOReceivedDate', { poNumber: currentPoNumber, value: f.receivedDate || null });
      }
      msg.className='msg ok'; msg.textContent='Saved.';
      setTimeout(() => { closeModalOverlay('editPOOverlay'); renderPurchaseOrderDetail(); }, 400);
    }catch(e){
      msg.className='msg err'; msg.textContent = e.message;
      // A rename may have already gone through before a later field failed —
      // point the screen at the new number so it isn't stuck on a stale one.
      if(currentPoNumber !== poNumber) state.selectedPO = currentPoNumber;
    }
  };
}

async function renderPurchaseOrderDetail(){
  state.view = 'purchaseorders'; persistView();
  let poNumber = state.selectedPO;
  const myToken = ++poRenderToken;
  $main.innerHTML = `<div class="view-head"><a href="#" id="backToPO" style="color:var(--blue);font-size:12.5px;text-decoration:none;">← All Purchase Orders</a>
    <h2 class="view-title" style="margin-top:8px;">${poNumber}</h2></div>` + panelShell('loading');
  document.getElementById('backToPO').onclick = (e) => { e.preventDefault(); state.selectedPO = null; renderPurchaseOrders(); };
  try{
    const catalog = await ensureCatalog();
    const [orders, lines] = await Promise.all([apiGet('purchaseOrder'), apiGet('purchaseOrderLine')]);
    if(myToken !== poRenderToken) return; // a newer render started while we were fetching — don't append stale panels
    const header = orders.find(o => o.PONumber === poNumber);
    const myLines = lines.filter(l => l.PONumber === poNumber);
    // Status workflow: Open -> RFQ -> Purchase Order -> Received -> Validated,
    // with a "back to previous stage" button at every step except Open, and
    // Cancel available any time before Received. 'Confirmed'/'In Transit' are
    // legacy values from an earlier version of this workflow — treated as
    // Purchase Order so old data isn't stuck on a status that no longer exists.
    const rawStatus = header ? header.Status : 'Open';
    const status = (rawStatus === 'Confirmed' || rawStatus === 'In Transit') ? 'Purchase Order' : (rawStatus || 'Open');
    const isCancelled = status === 'Cancelled';
    const isOpen = !isCancelled && status === 'Open';
    const isRFQ = !isCancelled && status === 'RFQ';
    const isPO = !isCancelled && status === 'Purchase Order';
    const isReceived = !isCancelled && status === 'Received';
    const isValidated = !isCancelled && status === 'Validated';
    const canCancel = isOpen || isRFQ || isPO; // matches the DB guard: blocked once anything's received
    // Add/delete line items — and the Quotation #/Invoice #/Received date
    // fields, which mean nothing until later stages actually set them — are
    // all Open-only now: once Confirm Order has moved the PO on, its line
    // structure is locked in and edited only through the line table itself.
    const canDeleteLine = isOpen;
    const qtyEditableStage = isOpen;           // Qty ordered only editable in the Open (draft) stage
    const confirmedEditableStage = isRFQ;      // Confirmed qty only editable in the RFQ stage
    const qtyReceivedEditableStage = isPO;     // Qty received only editable in the Purchase Order stage
    const showConfirmedCol = !isOpen;          // Confirmed qty column hidden until RFQ (and beyond)
    const showReceivedCol = isPO || isReceived || isValidated; // Qty received column hidden until Purchase Order (and beyond)
    // PO number / Quotation # / Invoice # / Received date are no longer
    // inline-editable here — they're all edited via the "Edit" button/modal
    // below (openEditPOModal), same pattern as the Sales Order screen. The
    // per-field stage restrictions (e.g. quotation # only in RFQ) still
    // apply server-side in their respective apiPost cases.
    const enrichedLines = myLines.map(l => {
      const isConfirmed = l.ConfirmedQty !== null && l.ConfirmedQty !== '' && l.ConfirmedQty !== undefined;
      const confirmedVal = isConfirmed ? Number(l.ConfirmedQty) : Number(l.QtyOrdered||0);
      // Qty received defaults to Confirmed qty until an actual received
      // amount has been entered (the DB column defaults to 0, so anything
      // still at 0 reads as "not yet counted" and shows the confirmed qty).
      const receivedVal = Number(l.QtyReceived||0) > 0 ? Number(l.QtyReceived) : confirmedVal;
      return Object.assign({}, l, { _confirmedVal: confirmedVal, _isConfirmed: isConfirmed, _receivedVal: receivedVal });
    });
    const rowsHtml = enrichedLines.map(l => {
      const orderedCell = qtyEditableStage
        ? `<input type="number" class="qtyOrderedInput" min="1" value="${l.QtyOrdered}" data-original="${l.QtyOrdered}" style="width:80px;text-align:center;">`
        : fmt(l.QtyOrdered);
      const confirmedCell = confirmedEditableStage
        ? `<input type="number" class="confirmQtyInput" min="0" value="${l._confirmedVal}" data-original="${l._confirmedVal}" style="width:80px;text-align:center;">`
        : fmt(l._confirmedVal);
      const receivedCell = qtyReceivedEditableStage
        ? `<input type="number" class="qtyReceivedInput" min="0" value="${l._receivedVal}" data-original="${l._receivedVal}" style="width:80px;text-align:center;">`
        : fmt(l._receivedVal);
      return `
      <tr data-linenum="${l.LineNum}">
        <td class="sku">${l.SKU}</td><td>${barcodeItemLabel(l.zSKU, catalog)}</td>
        <td class="num">${orderedCell}</td>
        <td class="num">${fmt(l.UnitCost)}</td><td class="num">${fmt(l.LineTotal)}</td>
        ${showConfirmedCol ? `<td class="num">${confirmedCell}</td>` : ''}
        ${showReceivedCol ? `<td class="num">${receivedCell}</td>` : ''}
        <td>${canDeleteLine ? `<button type="button" class="btn deleteLineBtn" data-linenum="${l.LineNum}" style="color:var(--red);" title="Delete this line">✕</button>` : ''}</td>
      </tr>`;
    }).join('');

    const totalQtyOrdered = enrichedLines.reduce((s,l) => s + Number(l.QtyOrdered||0), 0);
    const totalOrderedValue = enrichedLines.reduce((s,l) => s + Number(l.LineTotal||0), 0);
    const totalConfirmedQty = enrichedLines.reduce((s,l) => s + Number(l._confirmedVal||0), 0);
    const totalConfirmedValue = enrichedLines.reduce((s,l) => s + Number(l._confirmedVal||0) * Number(l.UnitCost||0), 0);
    const totalReceivedQty = enrichedLines.reduce((s,l) => s + Number(l._receivedVal||0), 0);
    const totalReceivedValue = enrichedLines.reduce((s,l) => s + Number(l._receivedVal||0) * Number(l.UnitCost||0), 0);

    // Every status-change button on the header just tells setPOStatus which
    // status to jump to and what confirm() text to show — one handler for
    // all of them, forward or back.
    const statusActions = [];
    if(isOpen){
      statusActions.push({ id:'confirmOrderBtn', label:'Confirm Order', primary:true, to:'RFQ', confirmMsg:'Confirm the Qty ordered and send this as an RFQ? Qty ordered will lock.' });
    }
    if(isRFQ){
      statusActions.push({ id:'confirmQuoteBtn', label:'Confirm Quotation', primary:true, to:'Purchase Order', quote:true });
      statusActions.push({ id:'backToOpenBtn', label:'Back to Open', primary:false, to:'Open', confirmMsg:'Move this PO back to Open? Qty ordered becomes editable again.' });
    }
    if(isPO){
      statusActions.push({ id:'receivedBtn', label:'Received', primary:true, to:'Received', confirmMsg:'Mark this PO as Received?' });
      statusActions.push({ id:'receivedValidateBtn', label:'Received and Validate', primary:true, to:'Validated', receiveValidate:true });
      statusActions.push({ id:'backToRFQBtn', label:'Back to RFQ', primary:false, to:'RFQ', confirmMsg:'Move this PO back to RFQ?' });
    }
    if(isReceived){
      statusActions.push({ id:'validateBtn', label:'Validate', primary:true, to:'Validated', validate:true });
      statusActions.push({ id:'backToPOBtn', label:'Back to Purchase Order', primary:false, to:'Purchase Order', confirmMsg:'Move this PO back to Purchase Order?' });
    }
    if(isValidated){
      statusActions.push({ id:'backToReceivedBtn', label:'Back to Received', primary:false, to:'Received', confirmMsg:'Move this PO back to Received?' });
    }

    setPanel(`
      <div class="panel-head"><h3>Purchase Order - Summary</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${isCancelled ? `<span class="chip red">Cancelled</span>` : ''}
          ${isValidated ? `<span class="chip green">Validated</span>` : ''}
          ${statusActions.map(a => `<button class="btn${a.primary?' primary':''}" id="${a.id}">${a.label}</button>`).join('')}
          ${canCancel ? `<button class="btn" id="cancelPOBtn" style="border-color:var(--red);color:var(--red);">Cancel order</button>` : ''}
        </div></div>
      <div class="batch-bar" style="flex-wrap:wrap;">
        <label>PO number</label><span>${poNumber}</span>
        <label>Date</label><span>${header?header.PODate:''}</span>
        <label>Supplier</label><span>${header?header.Supplier:''}</span>
        <label>Status</label><span>${poStatusChip(status)}</span>
        ${!isOpen && !isRFQ ? `<label>Quotation #</label><span>${(header&&header.QuotationNumber)||'—'}</span>
        <label>Expected receiving date</label><span>${(header&&header.ExpectedReceivingDate)||'—'}</span>` : ''}
        ${isReceived || isValidated ? `<label>Invoice #</label><span>${(header&&header.InvoiceNumber)||'—'}</span>
        <label>Received date</label><span>${(header&&header.ReceivedDate)||'—'}</span>` : ''}
        <button class="btn" id="editPOBtn" style="margin-left:auto;">Edit</button>
      </div>
    `);
    const cancelBtn = document.getElementById('cancelPOBtn');
    if(cancelBtn) cancelBtn.onclick = async () => {
      if(!confirm(`Cancel ${poNumber}?`)) return;
      try{ await apiPost('cancelPurchaseOrder', { poNumber }); renderPurchaseOrderDetail(); }
      catch(e){ alert(e.message); } // server blocks this if anything's already been received
    };
    document.getElementById('editPOBtn').onclick = () => openEditPOModal(header, poNumber);
    statusActions.forEach(a => {
      const btn = document.getElementById(a.id);
      if(!btn) return;
      btn.onclick = async () => {
        // Qty ordered / Confirmed qty / Qty received edits are saved via the
        // separate "Save changes" button on the line-items table, not by
        // this status button — so a dirty, unsaved line edit would otherwise
        // be silently discarded the moment the status change re-fetches and
        // re-renders the lines. Block and point at Save changes instead.
        const dirtyLineEdit = Array.from(document.querySelectorAll('.qtyOrderedInput, .confirmQtyInput, .qtyReceivedInput'))
          .some(inp => !inp.disabled && inp.value !== inp.dataset.original);
        if(dirtyLineEdit){
          alert('You have unsaved line-item changes (Qty ordered / Confirmed qty / Qty received). Click "Save changes" first, then try again.');
          return;
        }
        if(a.quote){
          // Same pattern as the Sales Order screen's "Confirm delivery":
          // the button opens a small form asking for the one thing this
          // transition actually needs (here, the Quotation number) instead
          // of requiring it be entered ahead of time via Edit.
          openConfirmQuotationModal(header && header.QuotationNumber, header && header.ExpectedReceivingDate, async (quotationNumber, expectedReceivingDate) => {
            btn.disabled = true;
            try{
              await apiPost('updatePOQuotationNumber', { poNumber, value: quotationNumber });
              await apiPost('updatePOExpectedReceivingDate', { poNumber, value: expectedReceivingDate });
              // Confirming the quotation is the moment Confirmed qty stops
              // being editable per-line and starts being read everywhere
              // (warehouse receiving, totals) as "confirmed_qty or Qty
              // ordered". Write that same fallback value into confirmed_qty
              // now, for every line that hasn't been individually
              // overridden, so the stored data matches what's displayed
              // instead of only ever existing as a display-time fallback.
              // Must happen while still in RFQ — updatePOConfirmation only
              // allows writes there.
              for(const l of enrichedLines){
                if(!l._isConfirmed){
                  await apiPost('updatePOConfirmation', { poNumber, lineNum: l.LineNum, confirmedQty: l._confirmedVal });
                }
              }
              await apiPost('setPOStatus', { poNumber, status: a.to });
              renderPurchaseOrderDetail();
            }catch(e){ alert(e.message); btn.disabled = false; }
          });
          return;
        }
        if(a.receiveValidate){
          // Same pattern as Confirm Quotation / Confirm delivery: collect
          // what this transition actually needs (Invoice number, Received
          // date) right there instead of requiring it be entered ahead of
          // time via Edit.
          openReceivedValidateModal(header && header.InvoiceNumber, (header && header.ReceivedDate) || today(), async (invoiceNumber, receivedDate) => {
            btn.disabled = true;
            try{
              // Same display-fallback issue as Confirmed qty: the Qty
              // received column shows Confirmed qty as its default for any
              // line still at qty_received = 0, but that default is
              // display-only — it's never written unless the field was
              // manually edited and Save changes clicked. Pressing Received
              // and Validate is the moment this needs to actually land in
              // qty_received.
              for(const l of enrichedLines){
                const delta = Number(l._receivedVal||0) - Number(l.QtyReceived||0);
                if(delta !== 0){
                  await apiPost('updateWarehouseReceipt', { poNumber, lineNum: l.LineNum, receivedQty: delta });
                }
              }
              await apiPost('updatePOInvoiceNumber', { poNumber, value: invoiceNumber });
              await apiPost('updatePOReceivedDate', { poNumber, value: receivedDate });
              await apiPost('setPOStatus', { poNumber, status: a.to });
              renderPurchaseOrderDetail();
            }catch(e){ alert(e.message); btn.disabled = false; }
          });
          return;
        }
        if(a.validate){
          // Same "collect what the transition needs, right there" pattern
          // as Received and Validate — qty received is already locked by
          // this stage (only editable back at Purchase Order), so this just
          // needs Invoice number + Received date before moving to Validated.
          openReceivedValidateModal(header && header.InvoiceNumber, (header && header.ReceivedDate) || today(), async (invoiceNumber, receivedDate) => {
            btn.disabled = true;
            try{
              await apiPost('updatePOInvoiceNumber', { poNumber, value: invoiceNumber });
              await apiPost('updatePOReceivedDate', { poNumber, value: receivedDate });
              await apiPost('setPOStatus', { poNumber, status: a.to });
              renderPurchaseOrderDetail();
            }catch(e){ alert(e.message); btn.disabled = false; }
          });
          return;
        }
        if(a.requireField){
          const val = header ? (header[a.requireField]||'').toString().trim() : '';
          if(!val){ alert(a.requireMsg); return; }
        }
        if(!confirm(a.confirmMsg)) return;
        btn.disabled = true;
        try{
          if(a.id === 'receivedBtn'){
            // Same display-fallback issue as Confirmed qty: the Qty received
            // column shows Confirmed qty as its default for any line that's
            // still at qty_received = 0 (l._receivedVal), but that default
            // is display-only — it's never written unless the field was
            // manually edited and Save changes clicked. Pressing Received is
            // the moment this needs to actually land in qty_received, so
            // write the delta between what's shown and what's actually
            // stored for every such line now, via the same additive RPC the
            // Save changes button and the warehouse app use (so the "PO
            // Received" ledger entry / stock bump still fires correctly off
            // the real qty_received change).
            for(const l of enrichedLines){
              const delta = Number(l._receivedVal||0) - Number(l.QtyReceived||0);
              if(delta !== 0){
                await apiPost('updateWarehouseReceipt', { poNumber, lineNum: l.LineNum, receivedQty: delta });
              }
            }
          }
          await apiPost('setPOStatus', { poNumber, status: a.to }); renderPurchaseOrderDetail();
        }
        catch(e){
          alert(e.message);
          btn.disabled = false;
        }
      };
    });

    const linesPanel = document.createElement('div');
    linesPanel.className = 'panel';
    linesPanel.innerHTML = `
      <div class="panel-head"><h3>${myLines.length} line item(s)</h3>
        <div style="display:flex;gap:8px;">
          ${myLines.length ? exportBtnHtml('poExportBtn','Export lines') : ''}
          ${myLines.length && (qtyEditableStage || confirmedEditableStage || qtyReceivedEditableStage) ? `<button class="btn" id="cancelLineEditsBtn" style="display:none;">Cancel</button>
          <button class="btn primary" id="saveConfirmedBtn" style="display:none;">Save changes</button>` : ''}
        </div></div>
      ${myLines.length ? `<table><thead><tr><th>SKU</th><th>Item name</th><th class="num">Qty ordered</th><th class="num">Unit cost</th><th class="num">Line total</th>${showConfirmedCol ? '<th class="num">Confirmed qty</th>' : ''}${showReceivedCol ? '<th class="num">Qty received</th>' : ''}<th></th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
        <div class="batch-bar" style="flex-wrap:wrap;border-top:1px solid var(--border);font-weight:600;">
          <label>Total qty ordered</label><span>${fmt(totalQtyOrdered)}</span>
          <label>Value</label><span>${fmt(totalOrderedValue)}</span>
          ${showConfirmedCol ? `<span style="color:var(--text-faint);font-weight:400;">|</span>
          <label>Total confirmed qty</label><span>${fmt(totalConfirmedQty)}</span>
          <label>Value</label><span>${fmt(totalConfirmedValue)}</span>` : ''}
          ${showReceivedCol ? `<span style="color:var(--text-faint);font-weight:400;">|</span>
          <label>Total qty received</label><span>${fmt(totalReceivedQty)}</span>
          <label>Value</label><span>${fmt(totalReceivedValue)}</span>` : ''}
        </div>
        <div class="empty" style="text-align:left;padding:10px 16px;">${isOpen ? 'Qty ordered is editable while this PO is Open. Click "Confirm Order" once it\'s ready to send as an RFQ — Qty ordered then locks.' : isRFQ ? 'Confirmed qty is editable while this PO is an RFQ — it defaults to Qty Ordered, edit if the supplier\'s quotation differs, then Save. Click "Confirm Quotation" once confirmed — Confirmed qty then locks.' : isPO ? 'Qty received is editable while this PO is in the Purchase Order stage — edit it as shipments arrive, then Save (this also updates the Warehouse module\'s receiving ledger).' : 'This order is closed — no further edits.'}</div>`
        : emptyState('No items yet — add one below or import a file.')}`;
    document.getElementById('main').appendChild(linesPanel);
    const poExportBtn = document.getElementById('poExportBtn');
    if(poExportBtn) poExportBtn.onclick = () => exportRows(myLines, `${poNumber}-lines.xlsx`, poNumber);
    const saveBtn = document.getElementById('saveConfirmedBtn');
    const cancelEditsBtn = document.getElementById('cancelLineEditsBtn');
    function checkLinesDirty(){
      if(!saveBtn) return;
      const dirty = Array.from(document.querySelectorAll('.qtyOrderedInput, .confirmQtyInput, .qtyReceivedInput'))
        .some(inp => !inp.disabled && inp.value !== inp.dataset.original);
      saveBtn.style.display = dirty ? '' : 'none';
      if(cancelEditsBtn) cancelEditsBtn.style.display = dirty ? '' : 'none';
    }
    document.querySelectorAll('.qtyOrderedInput, .confirmQtyInput, .qtyReceivedInput').forEach(inp => inp.addEventListener('input', checkLinesDirty));
    if(cancelEditsBtn) cancelEditsBtn.onclick = () => {
      document.querySelectorAll('.qtyOrderedInput, .confirmQtyInput, .qtyReceivedInput').forEach(inp => { inp.value = inp.dataset.original; });
      checkLinesDirty();
    };
    if(saveBtn) saveBtn.onclick = async () => {
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      try{
        const rows = document.querySelectorAll('tr[data-linenum]');
        for(const tr of rows){
          const lineNum = tr.dataset.linenum;
          const qtyInput = tr.querySelector('.qtyOrderedInput');
          if(qtyInput && !qtyInput.disabled && qtyInput.value && qtyInput.value !== qtyInput.dataset.original){
            await apiPost('updatePOLineQty', { poNumber, lineNum, qtyOrdered: qtyInput.value });
          }
          const confirmInput = tr.querySelector('.confirmQtyInput');
          if(confirmInput && !confirmInput.disabled && confirmInput.value !== confirmInput.dataset.original){
            await apiPost('updatePOConfirmation', { poNumber, lineNum, confirmedQty: confirmInput.value });
          }
          const receivedInput = tr.querySelector('.qtyReceivedInput');
          if(receivedInput && !receivedInput.disabled && receivedInput.value !== receivedInput.dataset.original){
            // The field shows/edits the running TOTAL received on this line,
            // but updateWarehouseReceipt (shared with the warehouse app's
            // "Qty now" flow, and the ledger trigger it feeds) is additive —
            // it adds whatever's sent to the existing qty_received. Sending
            // the new total as-is would double-count anything already
            // received, so send the delta (new total - old total) instead.
            const delta = Number(receivedInput.value || 0) - Number(receivedInput.dataset.original || 0);
            if(delta !== 0) await apiPost('updateWarehouseReceipt', { poNumber, lineNum, receivedQty: delta });
          }
        }
        renderPurchaseOrderDetail();
      }catch(e){ alert('Could not save: ' + e.message); saveBtn.disabled = false; saveBtn.textContent = 'Save changes'; checkLinesDirty(); }
    };
    document.querySelectorAll('.deleteLineBtn').forEach(btn => {
      btn.onclick = async () => {
        const lineNum = btn.dataset.linenum;
        if(!confirm('Delete this line item? This can\'t be undone.')) return;
        btn.disabled = true;
        try{
          await apiPost('deletePurchaseOrderLine', { poNumber, lineNum });
          renderPurchaseOrderDetail();
        }catch(e){ alert(e.message); btn.disabled = false; }
      };
    });

    if(!isOpen){ return; } // "Add items" only applies to a draft (Open) order — once Confirm Order has moved it on, items are locked in and edited via the line table itself

    // Item pool for the dropdown: prefer items already tagged with this PO's
    // supplier, so the suggestions are actually relevant; fall back to the
    // whole catalog if that supplier has no tagged items (or the PO has no
    // supplier set) so the field is never empty/useless.
    const supplierName = header ? header.Supplier : '';
    let itemPool = supplierName ? catalog.filter(c => c.Supplier === supplierName) : catalog;
    if(!itemPool.length) itemPool = catalog;
    const itemOptionsHtml = itemPool.map(c => `<option value="${c.SKU}" label="${(c.ItemName||'').replace(/"/g,'&quot;')}">`).join('');

    const addPanel = document.createElement('div');
    addPanel.className = 'panel';
    addPanel.innerHTML = `
      <div class="panel-head"><h3>Add items</h3>
        <button class="btn" id="poShowImportBtn">Import items</button></div>
      <table id="poAddItemsTable">
        <thead><tr><th>Item (zSKU, SKU or barcode)</th><th class="num">Qty ordered</th><th></th></tr></thead>
        <tbody id="poAddItemsBody">
          <tr class="poAddRow">
            <td><input type="text" class="poItemInput" list="poItemOptions" placeholder="Type or pick an item" autocomplete="off" style="width:100%;">
              <span class="msg err poRowErr" style="display:none;">Item not found</span></td>
            <td class="num"><input type="number" class="poQtyInput" min="1" style="width:90px;text-align:right;"></td>
            <td><button type="button" class="btn poRemoveRowBtn" style="display:none;" title="Remove row">✕</button></td>
          </tr>
        </tbody>
      </table>
      <datalist id="poItemOptions">${itemOptionsHtml}</datalist>
      <div class="form-foot" style="padding:12px 16px;">
        <button class="btn primary" id="poAddItemsBtn">Add items</button>
        <span class="msg" id="poLineMsg"></span>
      </div>`;
    document.getElementById('main').appendChild(addPanel);

    const addBody = document.getElementById('poAddItemsBody');
    function newRow(){
      const tr = document.createElement('tr');
      tr.className = 'poAddRow';
      tr.innerHTML = `
        <td><input type="text" class="poItemInput" list="poItemOptions" placeholder="Type or pick an item" autocomplete="off" style="width:100%;">
          <span class="msg err poRowErr" style="display:none;">Item not found</span></td>
        <td class="num"><input type="number" class="poQtyInput" min="1" style="width:90px;text-align:right;"></td>
        <td><button type="button" class="btn poRemoveRowBtn" title="Remove row">✕</button></td>`;
      wireRow(tr);
      return tr;
    }
    function wireRow(tr){
      const itemInput = tr.querySelector('.poItemInput');
      const qtyInput = tr.querySelector('.poQtyInput');
      const removeBtn = tr.querySelector('.poRemoveRowBtn');
      const maybeGrow = () => {
        const isLast = tr === addBody.lastElementChild;
        if(isLast && itemInput.value.trim() && qtyInput.value){
          addBody.appendChild(newRow());
        }
      };
      itemInput.addEventListener('input', maybeGrow);
      qtyInput.addEventListener('input', maybeGrow);
      removeBtn.onclick = () => { if(addBody.children.length > 1) tr.remove(); };
    }
    wireRow(addBody.querySelector('.poAddRow'));

    document.getElementById('poAddItemsBtn').onclick = async () => {
      const msg = document.getElementById('poLineMsg');
      document.querySelectorAll('.poRowErr').forEach(e => e.style.display = 'none');
      document.querySelectorAll('.poItemInput').forEach(i => i.style.borderColor = '');
      const items = [];
      let hadError = false;
      addBody.querySelectorAll('.poAddRow').forEach(tr => {
        const itemInput = tr.querySelector('.poItemInput');
        const qtyInput = tr.querySelector('.poQtyInput');
        const raw = itemInput.value.trim();
        if(!raw && !qtyInput.value) return; // blank trailing row — ignore
        const zsku = resolveZsku(raw, catalog);
        if(!zsku){
          hadError = true;
          itemInput.style.borderColor = 'var(--red)';
          tr.querySelector('.poRowErr').style.display = '';
          return;
        }
        const qty = Number(qtyInput.value || 0);
        if(!raw || qty <= 0) return;
        items.push({ zsku, qtyOrdered: qty });
      });
      if(hadError){ msg.className = 'msg err'; msg.textContent = 'Fix the highlighted item(s) — not found in the catalog.'; return; }
      if(!items.length){ msg.className = 'msg err'; msg.textContent = 'Enter at least one item with a qty.'; return; }
      msg.className='msg'; msg.textContent='Saving…';
      try{
        await apiPost('addPurchaseOrderBatch', {
          poNumber, poDate: header?header.PODate:today(), supplier: header?header.Supplier:'',
          items
        });
        renderPurchaseOrderDetail();
      }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
    };

    document.getElementById('poShowImportBtn').onclick = () => openPOImportModal(poNumber, header, catalog);
  }catch(e){ setPanel(errorState(e)); }
}

function openPOImportModal(poNumber, header, catalog){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'poImportOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="panel-head"><h3>Import items</h3>
        <div style="display:flex;gap:8px;">
          ${templateBtnHtml('poTemplateBtn')}
          <button class="btn" id="poImportCloseBtn">Close</button>
        </div></div>
      <div class="importzone" id="poImportDrop">Click to choose a file — columns ZSKU, QTY
        <input type="file" id="poImportFile" accept=".xlsx,.xls,.csv">
      </div>
      <div id="poImportBody"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModalOverlay('poImportOverlay'); };
  document.getElementById('poImportCloseBtn').onclick = () => closeModalOverlay('poImportOverlay');
  document.getElementById('poTemplateBtn').onclick = () => downloadTemplate(['zSKU','SKU','Barcode','QTY'], `${poNumber}-import-template.xlsx`);
