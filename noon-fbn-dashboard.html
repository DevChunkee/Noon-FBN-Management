<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noon FBN Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0F1115; --panel:#171A21; --panel-alt:#1D2129; --border:#272C36;
    --text:#E6E8EC; --text-dim:#8A93A3; --text-faint:#5A6270;
    --amber:#E8A33D; --green:#4FB286; --blue:#5B8DEF; --red:#D9736E; --purple:#9B7EDE;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    color-scheme: dark; /* tells the browser to draw native pickers (date
      calendar popup, etc.) in a dark variant instead of black-on-black */
  }
  *{box-sizing:border-box;}
  input[type=date]{position:relative;}
  input[type=date]::-webkit-calendar-picker-indicator{
    filter: invert(1) brightness(1.6); cursor:pointer; /* the calendar icon
      was rendering near-invisible (dark icon on our dark background) */
  }
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
  .app{display:flex;min-height:100vh;}

  /* ---- sidebar ---- */
  .rail{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 0;}
  .brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;}
  .brand-title{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .brand-sub{color:var(--text-dim);font-size:11px;margin-top:3px;font-family:var(--mono);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text-dim);
    cursor:pointer;border-left:2px solid transparent;font-size:13.5px;}
  .nav-item:hover{color:var(--text);background:var(--panel-alt);}
  .nav-item.active{color:var(--text);border-left-color:var(--blue);background:var(--panel-alt);font-weight:500;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:0 0 6px;}
  .nav-item.active .nav-dot{background:var(--blue);}
  .nav-section{padding:16px 20px 6px;font-size:10.5px;letter-spacing:.4px;color:var(--text-faint);
    text-transform:uppercase;border-top:1px solid var(--border);margin-top:6px;}
  .rail-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--border);}
  .conn{display:flex;align-items:center;gap:7px;font-size:11.5px;font-family:var(--mono);color:var(--text-faint);}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
  .conn.ok .conn-dot{background:var(--green);}
  .conn.err .conn-dot{background:var(--red);}

  /* ---- main ---- */
  .main{flex:1;padding:28px 36px;overflow-x:auto;}
  .view-head{margin-bottom:22px;}
  .view-title{font-size:20px;font-weight:700;margin:0 0 4px;}
  .view-sub{color:var(--text-dim);font-size:13px;margin:0;max-width:620px;line-height:1.5;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:20px;}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .panel-head h3{margin:0;font-size:13px;font-weight:600;}
  .btn{background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:5px;
    padding:7px 13px;font-size:12.5px;font-family:var(--sans);cursor:pointer;font-weight:500;}
  .btn:hover{border-color:var(--text-faint);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#0B0F16;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4;cursor:default;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11.5px;text-transform:none;
    padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel-alt);}
  .num{font-family:var(--mono);text-align:center;}
  .sku{font-family:var(--mono);color:var(--text-dim);}

  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-family:var(--mono);font-weight:500;}
  .chip.amber{background:rgba(232,163,61,.15);color:var(--amber);}
  .chip.green{background:rgba(79,178,134,.15);color:var(--green);}
  .chip.red{background:rgba(217,115,110,.15);color:var(--red);}
  .chip.blue{background:rgba(91,141,239,.15);color:var(--blue);}
  .chip.gray{background:rgba(138,147,163,.15);color:var(--text-dim);}
  .chip.purple{background:rgba(155,126,222,.15);color:var(--purple);}

  .empty{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13px;}
  .loading{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;font-family:var(--mono);}

  .form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form.wide{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.span2{grid-column:span 2;}
  label{font-size:12px;color:var(--text-dim);}
  input:not([type=checkbox]):not([type=radio]), select, textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:5px;padding:8px 10px;font-size:13px;font-family:var(--sans);}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--blue);}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}
  .form-foot{grid-column:span 2;display:flex;gap:10px;align-items:center;padding-top:4px;}
  .msg{font-size:12.5px;font-family:var(--mono);}
  .msg.ok{color:var(--green);}
  .msg.err{color:var(--red);}

  .weekly-row{display:grid;grid-template-columns:110px 1fr 120px 120px;gap:10px;align-items:center;
    padding:9px 16px;border-bottom:1px solid var(--border);}
  .weekly-row.head{color:var(--text-dim);font-size:11.5px;padding-bottom:8px;}
  .weekly-row input{width:100%;}

  .setup-note{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:16px 18px;
    font-size:12.5px;color:var(--text-dim);line-height:1.7;margin-bottom:18px;}
  .setup-note code{font-family:var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px;color:var(--text);}
  .setup-note ol{margin:8px 0 0;padding-left:20px;}

  .importzone{border:1.5px dashed var(--border);border-radius:6px;padding:22px;text-align:center;
    color:var(--text-dim);font-size:13px;margin:16px;cursor:pointer;}
  .importzone:hover{border-color:var(--blue);color:var(--text);}
  .importzone input{display:none;}
  .batch-bar{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .batch-bar input{width:180px;}
  .batch-bar label{font-size:12px;color:var(--text-dim);margin-right:4px;}
  select.mapSelect{font-size:12px;padding:5px 7px;}
  .toggle-group{display:flex;gap:6px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal .panel-head{border-radius:10px 10px 0 0;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--panel-alt);}

  .msfilter{position:relative;display:inline-block;}
  .msfilter-btn{font-size:12.5px;padding:8px 12px;}
  .msfilter-panel{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);
    border:1px solid var(--border);border-radius:6px;padding:8px;max-height:240px;overflow-y:auto;
    z-index:30;min-width:170px;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .msfilter-panel label{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:5px 4px;
    white-space:nowrap;cursor:pointer;border-radius:4px;}
  .msfilter-panel label:hover{background:var(--panel-alt);}
  .msfilter-panel input[type=checkbox]{width:14px;height:14px;}
  .toggle-btn{background:var(--panel-alt);border:1px solid var(--border);color:var(--text-dim);
    border-radius:5px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:var(--sans);}
  .toggle-btn.active{background:var(--blue);border-color:var(--blue);color:#0B0F16;font-weight:600;}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="brand">
      <div class="brand-title">Noon FBN Console</div>
      <div class="brand-sub">by NJPalma</div>
    </div>
    <div class="nav-item" data-view="catalog"><span class="nav-dot"></span>Master Catalog</div>
    <div class="nav-item" data-view="salesorders"><span class="nav-dot"></span>Sales Orders</div>
    <div class="nav-item" data-view="purchaseorders"><span class="nav-dot"></span>Purchase Orders</div>
    <div class="nav-item" data-view="ship"><span class="nav-dot"></span>Ship to Noon</div>
    <div class="nav-item" data-view="restock"><span class="nav-dot"></span>Restock internal</div>
    <div class="nav-item" data-view="weekly"><span class="nav-dot"></span>Weekly stock update</div>
    <div class="nav-item" data-view="adjust"><span class="nav-dot"></span>Log adjustment</div>
    <div class="nav-item" data-view="salesfunnel"><span class="nav-dot"></span>Log Monthly Sales</div>
    <div class="nav-section">Reports</div>
    <div class="nav-item" data-view="report-sales"><span class="nav-dot"></span>Sales Report</div>
    <div class="nav-item" data-view="report-fillrate"><span class="nav-dot"></span>Supplier Fill Rate</div>
    <div class="nav-item" data-view="report-insights"><span class="nav-dot"></span>Product Insights</div>
    <div class="nav-section">Configurations</div>
    <div class="nav-item" data-view="suppliers"><span class="nav-dot"></span>Suppliers</div>
    <div class="nav-item" data-view="deliverylocations"><span class="nav-dot"></span>Delivery Locations</div>
    <div class="nav-item" data-view="settings"><span class="nav-dot"></span>Settings</div>
    <div class="rail-foot">
      <div class="conn" id="connStatus"><span class="conn-dot"></span><span id="connLabel">not connected</span></div>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
const state = { config: null, catalog: [], view: 'catalog', selectedSO: null, selectedPO: null, session: null,
  catalogFilters: { brands: [], suppliers: [], flags: [], internalStock: [], noonStock: [] }, catalogSelected: new Set(), catalogSearch: '' };
const $main = document.getElementById('main');

function fmt(n){ if(n===null||n===undefined||n==='') return '—'; if(typeof n!=='number') return n;
  return Math.round(n*100)/100 === Math.round(n) ? Math.round(n).toLocaleString() : n.toFixed(2); }
function today(){ return new Date().toISOString().slice(0,10); }

// ---------------- Supabase connection + auth ----------------
// Baked in so you don't have to re-enter the Project URL/key every time this
// file is reopened (localStorage can get wiped when a local file moves, gets
// re-downloaded, or the browser clears local-file site data). The
// publishable/anon key is safe to ship in client code like this — it's
// designed to be public; real access control is the Row Level Security
// policies + login on the Supabase project, not secrecy of this key.
// TO CHANGE PROJECT OR ROTATE THE KEY: edit the two values below, save, and
// re-host/re-share this file.
const DEFAULT_CONFIG = {
  url: 'https://lqlfmjqjtkfvkdimlcvj.supabase.co',
  key: 'sb_publishable_rK8gwuct7u7pfeFVtMXowA_F_FnqqJ0'
};
let sb = null; // supabase client, created once we have url+key

async function loadConfig(){
  state.config = DEFAULT_CONFIG;
}
async function saveConfig(cfg){
  state.config = cfg;
}
function ensureClient(){
  if(!state.config || !state.config.url || !state.config.key) throw new Error('Not connected — set your Project URL and key in Settings.');
  if(!sb) sb = window.supabase.createClient(state.config.url, state.config.key);
  return sb;
}

function setConn(ok, label){
  const el = document.getElementById('connStatus');
  el.className = 'conn ' + (ok===null ? '' : (ok ? 'ok' : 'err'));
  document.getElementById('connLabel').textContent = label;
}
async function testConnection(){
  if(!state.config || !state.config.url || !state.config.key){ setConn(false,'no url set'); return false; }
  try{
    const client = ensureClient();
    const { data: { session } } = await client.auth.getSession();
    if(!session){ setConn(false, 'not logged in'); return false; }
    state.session = session;
    setConn(true, session.user.email);
    return true;
  }catch(e){ setConn(false, 'connection failed'); return false; }
}
async function signIn(email, password){
  const client = ensureClient();
  const { data, error } = await client.auth.signInWithPassword({ email, password });
  if(error) throw new Error(error.message);
  state.session = data.session;
  return data;
}
async function signOut(){
  if(sb) await sb.auth.signOut();
  state.session = null;
  setConn(false, 'signed out');
}

// Render-generation guards for the SO/PO detail screens: both append their
// line-items + "Add items" panels straight to #main with plain appendChild
// calls (after their own awaits), separately from the reset-and-replace
// $main.innerHTML at the top of each function. If the same detail screen
// gets re-entered while an earlier call is still awaiting (a fast
// double-click on a row, or one status action's re-render landing while a
// previous one hasn't resolved yet), each call's panels would stack up
// instead of cleanly replacing — a stale call finishing last leaves its own
// panels sitting alongside (or after) the current one's, which looks like a
// duplicated line-items table. Each function bumps its own token before
// starting and bails out (without touching the DOM) if a newer call has
// since started.
let soRenderToken = 0;
let poRenderToken = 0;

const tableCache = {};
const CACHE_TTL = 20000; // 20s — long enough that bouncing between modules feels instant
function invalidateCache(action){
  if(action) delete tableCache[action];
  else Object.keys(tableCache).forEach(k => delete tableCache[k]);
}
function refreshAll(){
  invalidateCache();
  state.catalog = [];
  render();
}

// ---- field-name maps: Postgres snake_case -> the field names every render
// function in this file already expects (unchanged from the Apps Script era) ----
const FIELD_MAPS = {
  masterCatalog: { zsku:'zSKU', barcode:'Barcode', sku:'SKU', item_name:'ItemName', moq:'MOQ', cost:'Cost',
    price:'Price', referral_fee:'ReferralFee', outbound_fee:'OutboundFee', storage_cost:'StorageCost',
    landed_cost:'LandedCost', net_margin:'NetMargin', margin_pct:'MarginPct', status:'Status',
    margin_flag:'MarginFlag', brand:'Brand', supplier:'Supplier' },
  noonInventory: { zsku:'zSKU', sku:'SKU', item_name:'ItemName', report_date:'ReportDate', saleable_qty:'SaleableQty',
    damaged_qty:'DamagedQty', in_transit_qty:'InTransitQty', total_position:'TotalPosition',
    avg_weekly_sales:'AvgWeeklySales', weeks_of_cover:'WeeksOfCover', reorder_flag:'ReorderFlag' },
  monthlySalesLog: { month:'Month', zsku:'zSKU', sku:'SKU', item_name:'ItemName', units_sold:'UnitsSold',
    revenue:'Revenue', referral_fee_paid:'ReferralFeePaid', net_revenue:'NetRevenue' },
  salesFunnelLog: { period:'Period', zsku:'zSKU', sku:'SKU', item_name:'ItemName', impressions:'Impressions',
    gvs:'GVs', atcs:'ATCs', units:'Units', gmv:'GMV', ctr:'CTR', cr:'CR', atc_cr:'ATCCR', cart_cr:'CartCR' },
  salesOrder: { so_number:'SONumber', ship_date:'ShipDate', scheduled_date:'ScheduledDate',
    dispatched_date:'DispatchedDate', delivered_date:'DeliveredDate', completed_date:'CompletedDate',
    shipment_day:'ShipmentDay', expected_sellable_date:'ExpectedSellableDate',
    total_units_sent:'TotalUnitsSent', total_confirmed_qty:'TotalConfirmedQty', total_effective_qty:'TotalEffectiveQty',
    total_delivered_qty:'TotalDeliveredQty', status:'Status', raw_status:'RawStatus',
    delivery_location_id:'DeliveryLocationId', delivery_location_name:'DeliveryLocationName',
    expected_delivery_date:'ExpectedDeliveryDate', expected_ship_day:'ExpectedShipDay',
    pod_file_path:'PodFilePath', pod_file_name:'PodFileName', pod_attached_at:'PodAttachedAt', pod_attached_by:'PodAttachedBy' },
  salesOrderLine: { so_number:'SONumber', line_num:'LineNum', zsku:'zSKU', qty_sent:'QtySent',
    confirmed_qty:'ConfirmedQty', delivered_qty:'DeliveredQty', shortage_reason:'ShortageReason',
    effective_qty:'EffectiveQty', so_status:'SOStatus', selling_price:'SellingPrice', line_total:'LineTotal',
    available_qty:'AvailableQty' },
  purchaseOrder: { po_number:'PONumber', po_date:'PODate', supplier:'Supplier', expected_delivery:'ExpectedDelivery',
    status:'Status', quotation_number:'QuotationNumber', invoice_number:'InvoiceNumber', received_date:'ReceivedDate',
    expected_receiving_date:'ExpectedReceivingDate', total_units:'TotalUnits', total_cost:'TotalCost', total_confirmed_qty:'TotalConfirmedQty',
    total_received_qty:'TotalReceivedQty' },
  purchaseOrderLine: { po_number:'PONumber', line_num:'LineNum', zsku:'zSKU', sku:'SKU', qty_ordered:'QtyOrdered',
    unit_cost:'UnitCost', line_total:'LineTotal', qty_received:'QtyReceived', confirmed_qty:'ConfirmedQty',
    effective_ordered_qty:'EffectiveOrderedQty' },
  replenishmentPlanner: { zsku:'zSKU', sku:'SKU', item_name:'ItemName', avg_weekly_sales:'AvgWeeklySales',
    growth_adjusted_weekly_sales:'GrowthAdjWeeklySales', noon_saleable_qty:'NoonSaleableQty', in_transit_qty:'InTransitQty',
    weeks_on_hand:'WeeksOnHand', qty_needed:'QtyNeeded', suggested_shipment_qty:'SuggestedShipQty', moq:'MOQ', ship_qty:'ShipQty' },
  internalReplenishment: { zsku:'zSKU', sku:'SKU', item_name:'ItemName', avg_weekly_demand:'AvgWeeklyDemand',
    growth_adjusted_weekly_demand:'GrowthAdjWeeklyDemand', internal_on_hand:'InternalOnHand', open_po_qty:'OpenPOQty',
    weeks_of_cover:'WeeksOfCover', qty_needed:'QtyNeeded', suggested_po_qty:'SuggestedPOQty', moq:'MOQ', po_qty:'POQty' },
  grnLog: { grn_date:'GRNDate', grn_number:'GRNNumber', so_number:'SONumber', zsku:'zSKU', qty_received:'QtyReceived',
    qty_damaged:'QtyDamaged', notes:'Notes' },
  weeklyStockLog: { week_ending:'WeekEnding', zsku:'zSKU', saleable_qty:'SaleableQty' },
  adjustmentLog: { adj_date:'Date', type:'Type', zsku:'zSKU', qty:'Qty', reason:'Reason' },
  suppliers: { id:'Id', name:'Name', contact_name:'ContactName', phone:'Phone', email:'Email',
    lead_time_weeks:'LeadTimeWeeks', notes:'Notes', status:'Status' },
  deliveryLocations: { id:'Id', location_name:'LocationName', location_address:'LocationAddress',
    location_link:'LocationLink', shipment_days:'ShipmentDays', status:'Status' },
};

function remap(row, map){
  const out = {};
  for(const k in row) out[map[k] || k] = row[k];
  return out;
}
// Adds SKU/ItemName from the (already-cached) catalog for logs that don't carry it themselves.
function enrichSkuName(row){
  const c = state.catalog.find(x => x.zSKU === row.zSKU);
  if(c){ row.SKU = row.SKU || c.SKU; row.ItemName = row.ItemName || c.ItemName; }
  return row;
}

const TABLES = {
  masterCatalog: 'v_master_catalog', noonInventory: 'noon_fbn_inventory', monthlySalesLog: 'v_monthly_sales_log',
  salesFunnelLog: 'v_sales_funnel_log', salesOrder: 'v_sales_orders', salesOrderLine: 'v_sales_order_lines',
  purchaseOrder: 'v_purchase_orders', purchaseOrderLine: 'v_purchase_order_lines',
  replenishmentPlanner: 'v_replenishment_planner', internalReplenishment: 'v_internal_wh_replenishment',
  grnLog: 'grn_log', weeklyStockLog: 'weekly_saleable_stock_log', adjustmentLog: 'inventory_adjustments',
  suppliers: 'suppliers', deliveryLocations: 'delivery_locations',
};

async function apiGetRaw(action){
  if(action === 'ping'){ const { error } = await ensureClient().from('settings').select('id').limit(1); if(error) throw new Error(error.message); return { ok:true }; }
  if(action === 'nextSONumber'){ const { data, error } = await ensureClient().rpc('rpc_next_so_number'); if(error) throw new Error(error.message); return { number: data }; }
  if(action === 'nextPONumber'){ const { data, error } = await ensureClient().rpc('rpc_next_po_number'); if(error) throw new Error(error.message); return { number: data }; }

  const table = TABLES[action];
  if(!table) throw new Error('Unknown action: ' + action);
  const { data, error } = await ensureClient().from(table).select('*');
  if(error) throw new Error(error.message);
  const map = FIELD_MAPS[action];
  let rows = map ? data.map(r => remap(r, map)) : data;
  if(['grnLog','weeklyStockLog','adjustmentLog'].includes(action)) rows = rows.map(enrichSkuName);
  if(action === 'adjustmentLog') rows = rows.map(r => Object.assign(r, {
    NetImpact: (r.Type === 'Damage / Write-off' || r.Type === 'Manual Deduction') ? -r.Qty : r.Qty
  }));
  return rows;
}
const UNCACHEABLE = new Set(['ping', 'nextSONumber', 'nextPONumber']);
async function apiGet(action, force){
  if(UNCACHEABLE.has(action)) return apiGetRaw(action);
  const now = Date.now();
  const cached = tableCache[action];
  if(!force && cached && (now - cached.ts) < CACHE_TTL) return cached.data;
  const data = await apiGetRaw(action);
  tableCache[action] = { data, ts: now };
  return data;
}

async function apiPost(action, payload){
  const client = ensureClient();
  let result;
  switch(action){
    case 'createSalesOrder': {
      const { error } = await client.from('sales_orders').insert({
        so_number: payload.soNumber, ship_date: payload.shipDate,
        expected_delivery_date: payload.expectedDeliveryDate || null,
        delivery_location_id: payload.deliveryLocationId ? Number(payload.deliveryLocationId) : null
      });
      if(error) throw new Error(error.code === '42703'
        ? 'The database doesn\'t have expected_delivery_date yet — ask an admin to run migration 18_so_expected_delivery.sql.'
        : error.message);
      result = { ok:true }; break;
    }
    case 'createPurchaseOrder': {

      if(error) throw new Error(error.code === '23505' ? 'A supplier with that name already exists.' : error.message);
      result = { ok:true }; break;
    }
    case 'archiveSupplier': {
      const { error } = await client.from('suppliers').update({ status: 'Archived' }).eq('id', payload.id);
      if(error) throw new Error(error.message); result = { ok:true }; break;
    }
    case 'unarchiveSupplier': {
      const { error } = await client.from('suppliers').update({ status: 'Active' }).eq('id', payload.id);
      if(error) throw new Error(error.message); result = { ok:true }; break;
    }
    case 'deleteSupplier': {
      const { error } = await client.from('suppliers').delete().eq('id', payload.id);
      if(error) throw new Error(error.code === '23503' ? 'This supplier is referenced by existing records and can\'t be deleted — archive it instead.' : error.message);
      result = { ok:true }; break;
    }
    default: throw new Error('Unknown action: ' + action);
  }
  if(action.toLowerCase().includes('supplier')) suppliersCache = null;
  if(action.toLowerCase().includes('deliverylocation')) deliveryLocationsCache = null;
  invalidateCache();
  return result;
}

async function apiPostBatched(action, items, extraFields, resultKey, onProgress){
  const CHUNK = 500;
  let total = 0;
  const chunks = [];
  for(let i = 0; i < items.length; i += CHUNK) chunks.push(items.slice(i, i + CHUNK));
  for(let i = 0; i < chunks.length; i++){
    if(onProgress) onProgress(i + 1, chunks.length);
    const r = await apiPost(action, Object.assign({}, extraFields, { items: chunks[i] }));
    total += Number(r[resultKey] || 0);
  }
  return { total, chunks: chunks.length };
}

async function fetchWithTimeout(url, opts, ms){
  // kept only because a couple of legacy call sites may still reference it; unused with Supabase.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms || 30000);
  try{ return await fetch(url, Object.assign({}, opts, { signal: controller.signal })); }
  finally{ clearTimeout(timer); }
}

// Wires blur/input/Enter validation for a .supplier-input inside `formEl`.
// Returns { validate } so the caller's onsubmit can block submission when
// the typed text doesn't match a known (active) supplier. An empty field is
// always considered valid — the field is optional.
function wireSupplierField(formEl, suppliers){
  const input = formEl.querySelector('.supplier-input');
  const err = formEl.querySelector('.supplier-err');
  if(!input) return { validate: () => true };
  const lower = new Map(suppliers.map(s => [s.toLowerCase(), s]));
  function validate(){
    const v = input.value.trim();
    if(!v){ err.style.display = 'none'; input.style.borderColor = ''; return true; }
    const match = lower.get(v.toLowerCase());
    if(!match){ err.style.display = ''; input.style.borderColor = 'var(--red)'; return false; }
    input.value = match;
    err.style.display = 'none'; input.style.borderColor = '';
    return true;
  }
  input.addEventListener('blur', validate);
  input.addEventListener('input', () => { if(err.style.display !== 'none') validate(); });
  formEl.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if(e.target === input) validate();
  });
  return { validate };
}

      reader.readAsArrayBuffer(file);

  });
}

// Mirrors v_master_catalog's margin math (01_schema.sql):
//   referral_fee = price * settings.referral_fee_pct
//   landed_cost  = cost + referral_fee + outbound_fee + storage_cost
//   net_margin   = price - landed_cost
//   margin_pct   = net_margin / price
function computeMargin(cost, price, outboundFee, storageCost, referralFeePct){
  price = Number(price)||0;
  cost = Number(cost)||0;
  outboundFee = Number(outboundFee)||0;
  storageCost = Number(storageCost)||0;
  referralFeePct = Number(referralFeePct)||0;
  if(price <= 0) return null;
  const referralFee = price * referralFeePct;
  const landedCost = cost + referralFee + outboundFee + storageCost;
  const netMargin = price - landedCost;
  return { netMargin, marginPct: netMargin / price };
}
// Wires live recalculation of a form's "Margin" display field whenever
// cost/price/outboundFee/storageCost change. formEl must contain inputs
// named cost, price, outboundFee, storageCost and an element with id
// marginFieldId to write the result into.
function wireMarginCalc(formEl, marginFieldId, referralFeePct, lowMarginThreshold){
  const out = document.getElementById(marginFieldId);
  if(!out) return;
  const inputs = ['cost','price','outboundFee','storageCost'].map(n => formEl.elements[n]).filter(Boolean);
  function recalc(){
    const cost = formEl.elements['cost'] ? formEl.elements['cost'].value : 0;
    const price = formEl.elements['price'] ? formEl.elements['price'].value : 0;
    const outboundFee = formEl.elements['outboundFee'] ? formEl.elements['outboundFee'].value : 0;
    const storageCost = formEl.elements['storageCost'] ? formEl.elements['storageCost'].value : 0;
    const m = computeMargin(cost, price, outboundFee, storageCost, referralFeePct);
    if(!m){ out.textContent = '—'; out.style.color = ''; return; }
    const pct = m.marginPct * 100;
    out.textContent = `${fmt(pct)}%  (net ${fmt(m.netMargin)})`;
    out.style.color = m.marginPct < lowMarginThreshold ? 'var(--red)' : (m.marginPct <= 0 ? 'var(--red)' : 'var(--green)');
  }
  inputs.forEach(inp => inp.addEventListener('input', recalc));
  recalc();
}

// ---------------- views ----------------
// Remembers which screen (and, for Purchase/Sales Orders, which specific
// order) is open so a browser refresh lands back where the user was
// instead of bouncing to Master Catalog. sessionStorage (not localStorage)
// is deliberate: it survives a refresh but clears itself once the tab/app
// is actually closed, matching "as long as I didn't close the browser".
const VIEW_STORAGE_KEY = 'noonFbnDashboardView';
// In-app navigation stack, kept in step with persistView()'s own
// sessionStorage bookkeeping and mirrored onto the browser's History API —
// so the browser/device Back button steps back through in-app screens (an
// order detail back to its list, say) instead of leaving the app outright.
let navStack = [];
let restoringNav = false;
function pushNavEntry(){
  const snapshot = { view: state.view, selectedSO: state.selectedSO, selectedPO: state.selectedPO };
  const last = navStack[navStack.length - 1];
  if(last && last.view === snapshot.view && last.selectedSO === snapshot.selectedSO && last.selectedPO === snapshot.selectedPO) return;
  navStack.push(snapshot);
  if(!restoringNav) history.pushState({ navIndex: navStack.length - 1 }, '');
}
window.addEventListener('popstate', () => {
  if(navStack.length <= 1) return; // nothing further back in-app — let the browser handle it
  navStack.pop();
  const prev = navStack[navStack.length - 1];
  restoringNav = true;
  state.view = prev.view; state.selectedSO = prev.selectedSO; state.selectedPO = prev.selectedPO;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === state.view));
  render();
  restoringNav = false;
});
function persistView(){
  try{
    sessionStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify({
      view: state.view, selectedPO: state.selectedPO, selectedSO: state.selectedSO
    }));
  }catch(e){ /* private-browsing / storage disabled — just skip persisting */ }
  pushNavEntry();
}
function restoreView(){
  try{
    const saved = JSON.parse(sessionStorage.getItem(VIEW_STORAGE_KEY) || 'null');
    if(saved && saved.view){
      state.view = saved.view;
      state.selectedPO = saved.selectedPO || null;
      state.selectedSO = saved.selectedSO || null;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === state.view));
    }
  }catch(e){ /* ignore corrupt/blocked storage — falls back to the default view */ }
}
function switchView(v){
  if(v !== state.view && state.view === 'catalog'){
    // Filters/selection are scoped to staying on this module — leaving it
    // (even to come back later) starts clean, same as a fresh page load.
    state.catalogFilters = { brands: [], suppliers: [], flags: [], internalStock: [], noonStock: [] };
    state.catalogSelected = new Set();
    state.catalogSearch = '';
  }
  state.view = v;
  state.selectedSO = null;
  state.selectedPO = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === v));
  persistView();
  render();
}

// Actively re-validates against Supabase (not just "do we have a cached
// session object") — this is what catches an AFK-expired session instead
// of silently querying as an unauthenticated user and getting 0 rows back.
// Network round-trip, so it's throttled (see VERIFY_COOLDOWN below) rather
// than run on every single navigation — that was the main cause of every
// screen switch feeling like a full reload.
let lastVerifiedAt = 0;
const VERIFY_COOLDOWN = 3 * 60 * 1000; // re-check with Supabase at most every 3 min
async function verifySession(force){
  if(!force && state.session && (Date.now() - lastVerifiedAt) < VERIFY_COOLDOWN) return true;
  try{
    const client = ensureClient();
    const { data, error } = await client.auth.getUser();
    if(error || !data.user){ state.session = null; setConn(false, 'session expired — please sign in again'); return false; }
    const { data: { session } } = await client.auth.getSession();
    state.session = session;
    lastVerifiedAt = Date.now();
    setConn(true, data.user.email);
    return true;
  }catch(e){ state.session = null; return false; }
}

async function render(){
  const v = state.view;
  if(!state.config || !state.config.url || !state.config.key){
    if(v !== 'settings'){ switchView('settings'); return; }
  } else if(v !== 'settings'){
    const valid = await verifySession();
    if(!valid){ return renderLogin(); }
  }
  if(v === 'catalog') return renderCatalog();
  if(v === 'salesorders') return state.selectedSO ? renderSalesOrderDetail() : renderSalesOrders();
  if(v === 'purchaseorders') return state.selectedPO ? renderPurchaseOrderDetail() : renderPurchaseOrders();
  if(v === 'ship') return renderReplenishment('replenishmentPlanner', 'Ship to Noon FBN', 'This week\'s shipment quantities — recalculates the moment you paste new weekly stock numbers.', 'ShipQty', 'SuggestedShipQty', 'NoonSaleableQty', 'Noon saleable', 'ship');
  if(v === 'restock') return renderReplenishment('internalReplenishment', 'Restock internal WH', 'Purchase order quantities needed from your supplier, paced by supplier lead time.', 'POQty', 'SuggestedPOQty', 'InternalOnHand', 'Internal on hand', 'restock');
  if(v === 'weekly') return renderWeekly();
  if(v === 'adjust') return renderAdjust();
  if(v === 'salesfunnel') return renderSalesFunnel();
  if(v === 'report-sales') return renderSalesReport();
  if(v === 'report-fillrate') return renderFillRateReport();
  if(v === 'report-insights') return renderProductInsights();
  if(v === 'suppliers') return renderSuppliers();
  if(v === 'deliverylocations') return renderDeliveryLocations();
  if(v === 'settings') return renderSettings();
}

        <thead><tr><th><input type="checkbox" id="catalogSelectAll" title="Select all shown rows"></th><th>SKU</th><th>Item</th><th>Brand</th><th>Supplier</th><th class="num">Cost</th><th class="num">Price</th><th class="num">Margin</th><th class="num">Internal WH</th><th class="num">Noon FBN</th><th>Status</th><th>Flag</th></tr></thead>
        <tbody>${rows}</tbody></table>` : emptyState('No SKUs yet — click "Add new SKU" above.')}
    `);
    document.getElementById('catalogExportBtn').onclick = () => {
      const checked = Array.from(document.querySelectorAll('.catalogRowCheck:checked')).map(cb => cb.closest('tr').dataset.zsku);
      let toExport;
      if(checked.length){
        toExport = state.catalog.filter(c => checked.includes(c.zSKU));
      }else{
        const visible = Array.from(document.querySelectorAll('tr[data-zsku]')).filter(tr => tr.style.display !== 'none').map(tr => tr.dataset.zsku);
        toExport = state.catalog.filter(c => visible.includes(c.zSKU));
      }
      exportRows(toExport, 'master-catalog.xlsx', 'Master Catalog');
    };
    document.querySelectorAll('.statusSelect').forEach(sel => {
      sel.onchange = async () => {
        const zsku = sel.dataset.zsku;
        sel.disabled = true;
        try{
          await apiPost('updateCatalogStatus', { zsku, status: sel.value });
          state.catalog = [];
        }catch(e){ alert('Could not update status: ' + e.message); }
        sel.disabled = false;
      };
    });
    document.querySelectorAll('tr.clickable[data-zsku]').forEach(tr => {
      tr.onclick = () => openCatalogEditModal(tr.dataset.zsku);
    });
    document.getElementById('catalogAddBtn').onclick = openCatalogAddModal;
    document.getElementById('catalogBulkBtn').onclick = openCatalogBulkModal;

    function updateCatalogSelCount(){
      const n = document.querySelectorAll('.catalogRowCheck:checked').length;
      const el = document.getElementById('selCount');
      if(el) el.textContent = `${n} selected`;
    }
    function applyCatalogFilter(){
      const { brands: fb, suppliers: fs, flags: ff, internalStock: fi, noonStock: fn } = state.catalogFilters;
      const q = (state.catalogSearch||'').trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('tr[data-zsku]').forEach(tr => {
        let show = true;
        if(fb.length && !fb.includes(tr.dataset.brand)) show = false;
        if(fs.length && !fs.includes(tr.dataset.supplier)) show = false;
        if(ff.length && !ff.includes(tr.dataset.flag)) show = false;
        if(fi.length && !fi.includes(tr.dataset.internalstock)) show = false;
        if(fn.length && !fn.includes(tr.dataset.noonstock)) show = false;
        if(q && !(tr.dataset.zskusearch.includes(q) || tr.dataset.sku.includes(q) || tr.dataset.barcode.includes(q))) show = false;
        tr.style.display = show ? '' : 'none';
        if(show) shown++;
      });
      const label = document.getElementById('rowCountLabel');
      const filtered = fb.length || fs.length || ff.length || fi.length || fn.length || q;
      if(label) label.textContent = filtered ? `${shown} of ${state.catalog.length} SKUs (filtered)` : `${state.catalog.length} SKU${state.catalog.length===1?'':'s'}`;
      const selectAll = document.getElementById('catalogSelectAll');
      if(selectAll) selectAll.checked = false;
    }
    const catalogSearchInput = document.getElementById('catalogSearchInput');
    if(catalogSearchInput) catalogSearchInput.oninput = () => {
      state.catalogSearch = catalogSearchInput.value;
      applyCatalogFilter();
    };
    if(state.catalog.length){
      const dimLabels = { brand: 'Brand', supplier: 'Supplier', flag: 'Flag', internalstock: 'Internal WH stock', noonstock: 'Noon FBN saleable' };
      function setBtnLabel(dim){
        const btn = document.getElementById(`ms_${dim}_btn`);
        const n = state.catalogFilters[DIMS[dim].key].length;
        if(btn) btn.textContent = n ? `${dimLabels[dim]} (${n})` : dimLabels[dim];
      }
      function wireCheckboxes(dim){
        const panel = document.getElementById(`ms_${dim}_panel`);
        panel.querySelectorAll(`.ms_${dim}_cb`).forEach(cb => {
          cb.onchange = () => {
            state.catalogFilters[DIMS[dim].key] = Array.from(panel.querySelectorAll(`.ms_${dim}_cb:checked`)).map(c => c.value);
            setBtnLabel(dim);
            applyCatalogFilter();
            rebuildOtherPanels(dim);
          };
        });
      }
      // After any filter changes, recompute the OTHER two dropdowns' option
      // lists from the newly-narrowed subset, dropping any of their own
      // selections that no longer apply, then re-render just those panels.
      function rebuildOtherPanels(changedDim){
        Object.keys(DIMS).forEach(dim => {
          if(dim === changedDim) return;
          const opts = optionsFor(dim);
          const stateKey = DIMS[dim].key;
          const stillValid = state.catalogFilters[stateKey].filter(v => opts.includes(v));
          const changed = stillValid.length !== state.catalogFilters[stateKey].length;
          state.catalogFilters[stateKey] = stillValid;
          const panel = document.getElementById(`ms_${dim}_panel`);
          panel.innerHTML = opts.length
            ? opts.map(v => `<label><input type="checkbox" class="ms_${dim}_cb" value="${v}" ${stillValid.includes(v)?'checked':''}> ${v}</label>`).join('')
            : `<div style="padding:4px 2px;color:var(--text-dim);font-size:12px;">No matching values</div>`;
          wireCheckboxes(dim);
          setBtnLabel(dim);
          if(changed) applyCatalogFilter();
        });
      }
      function wireMsToggle(dim){
        const btn = document.getElementById(`ms_${dim}_btn`);
        const panel = document.getElementById(`ms_${dim}_panel`);
        btn.onclick = (e) => {
          e.stopPropagation();
          document.querySelectorAll('.msfilter-panel').forEach(p => { if(p !== panel) p.style.display = 'none'; });
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        };
      }
      Object.keys(DIMS).forEach(dim => { wireMsToggle(dim); wireCheckboxes(dim); });
      document.addEventListener('click', function closeMsPanels(e){
        if(!e.target.closest('.msfilter')) document.querySelectorAll('.msfilter-panel').forEach(p => p.style.display = 'none');
      });
      document.getElementById('filterClearBtn').onclick = () => {
        state.catalogFilters = { brands: [], suppliers: [], flags: [], internalStock: [], noonStock: [] };
        state.catalogSearch = '';
        renderCatalog();
      };
      applyCatalogFilter();
      document.querySelectorAll('.catalogRowCheck').forEach(cb => {
        cb.onchange = () => {
          const zsku = cb.closest('tr').dataset.zsku;
          if(cb.checked) state.catalogSelected.add(zsku); else state.catalogSelected.delete(zsku);
          updateCatalogSelCount();
        };
      });
      updateCatalogSelCount();
      const catalogSelectAll = document.getElementById('catalogSelectAll');
      catalogSelectAll.onchange = () => {
        document.querySelectorAll('tr[data-zsku]').forEach(tr => {
          if(tr.style.display !== 'none'){
            const cb = tr.querySelector('.catalogRowCheck');
            cb.checked = catalogSelectAll.checked;
            if(catalogSelectAll.checked) state.catalogSelected.add(tr.dataset.zsku); else state.catalogSelected.delete(tr.dataset.zsku);
          }
        });
        updateCatalogSelCount();
      };
    }
  }catch(e){ setPanel(errorState(e)); }
}

function openCatalogBulkModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'catalogBulkOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="panel-head"><h3>Bulk import SKUs</h3>
        <div style="display:flex;gap:8px;">
          ${templateBtnHtml('catalogTemplateBtn')}
          <button class="btn" id="catalogBulkCloseBtn">Close</button>
        </div></div>
      <div class="importzone" id="catalogImportDrop">Click to choose a file — headers: zSKU, Barcode, SKU (any one required), Item Name, MOQ, Cost, Price, Outbound Fee, Storage Cost, Brand, Supplier
        <input type="file" id="catalogImportFile" accept=".xlsx,.xls,.csv">
      </div>
      <div id="catalogImportBody"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModalOverlay('catalogBulkOverlay'); };
  document.getElementById('catalogBulkCloseBtn').onclick = () => closeModalOverlay('catalogBulkOverlay');
  document.getElementById('catalogTemplateBtn').onclick = () => downloadTemplate(
    ['zSKU','Barcode','SKU','Item Name','MOQ','Cost','Price','Outbound Fee','Storage Cost','Brand','Supplier'],
    'master-catalog-template.xlsx');
  document.getElementById('catalogImportDrop').onclick = () => document.getElementById('catalogImportFile').click();
  document.getElementById('catalogImportFile').onchange = async (ev) => {
    const file = ev.target.files[0];
    if(!file) return;
    const body = document.getElementById('catalogImportBody');
    body.innerHTML = '<div class="loading">parsing…</div>';
    try{
      const wb = await readFileAsWorkbook(file);
      const parsed = sheetRows(wb);
      if(!parsed.length) throw new Error('No rows found.');
      const headers = Object.keys(parsed[0]);
      const norm = (h) => h.toLowerCase().replace(/[^a-z]/g,'');
      const findExact = (name) => headers.find(h => norm(h) === name);
      const findContains = (needles) => headers.find(h => needles.some(n => norm(h).includes(n)));
      const cols = {
        zsku: findExact('zsku') || findContains(['zsku']),
        barcode: findExact('barcode') || findContains(['barcode']),
        sku: findExact('sku') || headers.find(h => norm(h).includes('sku') && norm(h) !== 'zsku' && !norm(h).includes('zsku')),
        itemName: findExact('itemname') || findExact('name') || findContains(['itemname','productname']),
        moq: findExact('moq'), cost: findExact('cost'), price: findExact('price'),
        outboundFee: findContains(['outboundfee','outbound']), storageCost: findContains(['storagecost','storage']),
        brand: findExact('brand'), supplier: findExact('supplier')
      };
      const items = parsed.map(r => ({
        zsku: cols.zsku ? r[cols.zsku] : '', barcode: cols.barcode ? r[cols.barcode] : '',
        sku: cols.sku ? r[cols.sku] : '', itemName: cols.itemName ? r[cols.itemName] : '',
        moq: cols.moq ? r[cols.moq] : 0, cost: cols.cost ? r[cols.cost] : 0, price: cols.price ? r[cols.price] : 0,
        outboundFee: cols.outboundFee ? r[cols.outboundFee] : 0, storageCost: cols.storageCost ? r[cols.storageCost] : 0,
        brand: cols.brand ? r[cols.brand] : '', supplier: cols.supplier ? r[cols.supplier] : ''
      }));
      body.innerHTML = `<div class="batch-bar">
        <span class="msg">${items.length} row(s) parsed.</span>
        <button class="btn primary" id="catalogImportBtn">Import</button>
        <span class="msg" id="catalogImportMsg"></span></div>`;
      document.getElementById('catalogImportBtn').onclick = async () => {
        const msg = document.getElementById('catalogImportMsg');
        msg.className='msg'; msg.textContent='Saving…';
        try{
          const r = await apiPost('addCatalogItemsBatch', { items });
          msg.className='msg ok';
          msg.textContent = `Added ${r.added}, skipped ${r.skippedCount} (already existed or missing an identifier).`;
          state.catalog = [];
        }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
      };
    }catch(e){ body.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`; }
  };
}

async function renderReplenishment(action, title, sub, qtyKey, suggestedKey, stockKey, stockLabel, mode){
  $main.innerHTML = viewHead(title, sub) + panelShell('loading');
  try{
    const allRows = await apiGet(action);
    // Only worth showing a SKU here once it actually needs a qty — rows
    // sitting at 0 (already fully stocked, or nothing to suggest yet) just
    // add noise to a list meant for "what do I need to ship/order right now".
    const rows = allRows.filter(r => Number(r[qtyKey]) > 0);
    const nextNum = mode === 'ship'
      ? await apiGet('nextSONumber').catch(() => ({number:''}))
      : await apiGet('nextPONumber').catch(() => ({number:''}));
    const body = rows.length ? rows.map(r => `
      <tr data-zsku="${r.zSKU}" data-stock="${Number(r[stockKey])||0}">
        <td><input type="checkbox" class="rowCheck" ${Number(r[qtyKey])>0?'checked':''}></td>
        <td class="sku">${r.SKU||r.zSKU}</td>
        <td>${r.ItemName||''}</td>
        <td class="num">${fmt(r[stockKey])}</td>
        <td class="num">${fmt(r.WeeksOnHand !== undefined ? r.WeeksOnHand : r.WeeksOfCover)}</td>
        <td class="num">${fmt(r.MOQ)}</td>
        <td class="num"><input type="number" class="rowQty" min="0" value="${Math.round(Number(r[qtyKey])||0)}" style="width:90px;text-align:right;"></td>
      </tr>`).join('') : '';
    const batchBar = mode === 'ship' ? `
      <div class="batch-bar">
        <label>SO number</label><input type="text" id="batchSO" value="${nextNum.number||''}">
        <label>Creation date</label><input type="date" id="batchDate" value="${today()}">
        <button class="btn primary" id="batchAddBtn">Add checked items to Sales Order</button>
        <span class="msg" id="batchMsg"></span>
      </div>` : `
      <div class="batch-bar">
        <label>PO number</label><input type="text" id="batchPO" value="${nextNum.number||''}">
        <label>PO date</label><input type="date" id="batchDate" value="${today()}">
        <label>Supplier</label><input type="text" id="batchSupplier" placeholder="same for this order, edit per line later">
        <button class="btn primary" id="batchAddBtn">Add checked items to Purchase Order</button>
        <span class="msg" id="batchMsg"></span>
      </div>`;
    setPanel(`
      <div class="panel-head" style="flex-wrap:wrap;gap:10px;">
        <h3 id="rowCountLabel">${rows.length} SKU${rows.length===1?'':'s'} need${rows.length===1?'s':''} a qty</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${rows.length ? `<span class="msg" id="selCount" style="color:var(--text-dim);">0 selected</span>` : ''}
          <button class="btn" onclick="refreshAll()">Refresh</button>
        </div>
      </div>
      ${rows.length ? batchBar : ''}
      ${rows.length ? `<table>
        <thead><tr><th><input type="checkbox" id="selectAllCheck" title="Select all shown rows"></th><th>SKU</th><th>Item</th><th class="num">${stockLabel}</th><th class="num">Weeks cover</th><th class="num">MOQ</th><th class="num">Qty</th></tr></thead>
        <tbody>${body}</tbody></table>` : emptyState(`Nothing needs a qty right now — all ${allRows.length} tracked SKU${allRows.length===1?'':'s'} ${allRows.length===1?'is':'are'} covered.`)}
    `);
    function updateSelCount(){
      const n = document.querySelectorAll('tr[data-zsku] .rowCheck:checked').length;
      const el = document.getElementById('selCount');
      if(el) el.textContent = `${n} selected`;
    }
    function setAllChecks(checked){
      document.querySelectorAll('tr[data-zsku]').forEach(tr => {
        if(tr.style.display !== 'none') tr.querySelector('.rowCheck').checked = checked;
      });
      const selectAll = document.getElementById('selectAllCheck');
      if(selectAll) selectAll.checked = checked;
      updateSelCount();
    }
    document.querySelectorAll('.rowCheck').forEach(cb => cb.onchange = updateSelCount);
    updateSelCount();
    const selectAllCheck = document.getElementById('selectAllCheck');
    if(selectAllCheck) selectAllCheck.onchange = () => setAllChecks(selectAllCheck.checked);
    const btn = document.getElementById('batchAddBtn');
    if(btn) btn.onclick = async () => {
      const items = [];
      document.querySelectorAll('tr[data-zsku]').forEach(tr => {
        const check = tr.querySelector('.rowCheck');
        const qty = Number(tr.querySelector('.rowQty').value || 0);
        if(check.checked && qty > 0){
          items.push(mode === 'ship'
            ? { zsku: tr.dataset.zsku, qtySent: qty }
            : { zsku: tr.dataset.zsku, qtyOrdered: qty });
        }
      });
      const msg = document.getElementById('batchMsg');
      if(!items.length){ msg.className='msg err'; msg.textContent='Check at least one item with a qty > 0.'; return; }
      msg.className='msg'; msg.textContent='Saving…'; btn.disabled = true;
      try{
        if(mode === 'ship'){
          const soNumber = document.getElementById('batchSO').value;
          const shipDate = document.getElementById('batchDate').value;
          const r = await apiPostBatched('addSalesOrderBatch', items, { soNumber, shipDate }, 'linesAdded',
            (done, of) => { if(of > 1){ msg.className='msg'; msg.textContent = `Saving batch ${done}/${of}…`; } });
          msg.className='msg ok'; msg.textContent = `Added ${r.total} line(s) to ${soNumber}.`;
        }else{
          const poNumber = document.getElementById('batchPO').value;
          const poDate = document.getElementById('batchDate').value;
          const supplier = document.getElementById('batchSupplier').value;
          const r = await apiPostBatched('addPurchaseOrderBatch', items, { poNumber, poDate, supplier }, 'linesAdded',
            (done, of) => { if(of > 1){ msg.className='msg'; msg.textContent = `Saving batch ${done}/${of}…`; } });
          msg.className='msg ok'; msg.textContent = `Added ${r.total} line(s) to ${poNumber}.`;
        }
      }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
      btn.disabled = false;
    };
  }catch(e){ setPanel(errorState(e)); }
}

async function renderWeekly(){
  $main.innerHTML = viewHead('Weekly stock update', 'Import Monday\'s file, or paste this week\'s Noon FBN saleable stock directly. Saving updates the live snapshot and appends a trend row automatically.') + panelShell('loading');
  try{
    const catalog = await ensureCatalog();
    const rows = catalog.map(c => `
      <div class="weekly-row" data-zsku="${c.zSKU}">
        <div class="sku">${c.SKU}</div>
        <div>${c.ItemName}</div>
        <input type="number" min="0" class="w-saleable" placeholder="Saleable qty">
        <input type="number" min="0" class="w-damaged" placeholder="Damaged (opt.)">
      </div>`).join('');
    setPanel(`
      <div class="panel-head"><h3>Import file (optional)</h3>
        <div style="display:flex;gap:8px;">
          ${exportBtnHtml('weeklyExportBtn','Export current snapshot')}
          ${templateBtnHtml('weeklyTemplateBtn')}
        </div></div>
      <div class="importzone" id="weeklyDrop">Click to choose Monday's stock file — columns ZSKU, QTY (saleable only)
        <input type="file" id="weeklyFile" accept=".xlsx,.xls,.csv">
      </div>
      <div id="weeklyImportBody"></div>
      <div class="panel-head"><h3>Report date</h3>
        <input type="date" id="weekDate" value="${today()}" style="width:160px;"></div>
      <div class="weekly-row head"><div>SKU</div><div>Item</div><div>Saleable qty</div><div>Damaged qty</div></div>
      ${rows || emptyState('No SKUs in Master Catalog yet.')}
      <div style="padding:14px 16px;display:flex;gap:12px;align-items:center;">
        <button class="btn primary" id="saveWeekly">Save weekly stock</button>
        <span class="msg" id="weeklyMsg"></span>
      </div>
    `);
    document.getElementById('weeklyExportBtn').onclick = async () => {
      const snapshot = await apiGet('noonInventory');
      exportRows(snapshot, 'noon-fbn-stock-snapshot.xlsx', 'Noon FBN Stock');
    };
    document.getElementById('weeklyTemplateBtn').onclick = () => downloadTemplate(['zSKU','SKU','Barcode','QTY'], 'weekly-stock-template.xlsx');
    document.getElementById('weeklyDrop').onclick = () => document.getElementById('weeklyFile').click();
    document.getElementById('weeklyFile').onchange = async (ev) => {
      const file = ev.target.files[0];
      if(!file) return;
      const body = document.getElementById('weeklyImportBody');
      body.innerHTML = '<div class="loading">parsing…</div>';
      try{
        const wb = await readFileAsWorkbook(file);
        const parsed = sheetRows(wb);
        if(!parsed.length) throw new Error('No rows found in that file.');
        const headers = Object.keys(parsed[0]);
        const findExact = (name) => headers.find(h => h.toLowerCase().trim() === name);
        const applyFill = (skuCol, saleCol) => {
          let matched = 0, unmatched = 0;
          parsed.forEach(r => {
            const z = resolveZsku(r[skuCol], catalog);
            if(!z){ unmatched++; return; }
            const rowEl = document.querySelector(`.weekly-row[data-zsku="${z}"]`);
            if(!rowEl) return;
            rowEl.querySelector('.w-saleable').value = Number(r[saleCol]||0);
            matched++;
          });
          return { matched, unmatched };
        };

        // Known format: an identifier column (zSKU, SKU, or Barcode — any one) plus QTY.
        const zskuCol = findExact('zsku') || findExact('sku') || findExact('barcode');
        const qtyCol = findExact('qty');
        if(zskuCol && qtyCol){
          const { matched, unmatched } = applyFill(zskuCol, qtyCol);
          body.innerHTML = `<div class="empty" style="color:${unmatched?'var(--amber)':'var(--green)'};text-align:left;padding:10px 16px;">
            Recognized ${zskuCol}/${qtyCol} format — filled ${matched} row(s)${unmatched ? `, ${unmatched} unmatched skipped` : ''}. Review below, then Save.</div>`;
          return;
        }

        // Fallback: unrecognized headers, let the user map columns manually.
        const guess = (needles) => headers.find(h => needles.some(n => h.toLowerCase().includes(n))) || headers[0];
        const opts = headers.map(h => `<option value="${h}">${h}</option>`).join('');
        body.innerHTML = `
          <div class="batch-bar">
            <label>SKU column</label><select class="mapSelect" id="mapSku">${opts}</select>
            <label>Saleable qty column</label><select class="mapSelect" id="mapSaleable">${opts}</select>
            <button class="btn primary" id="applyMapping">Apply to table below</button>
            <span class="msg" id="weeklyMapMsg"></span>
          </div>`;
        document.getElementById('mapSku').value = guess(['sku','barcode']);
        document.getElementById('mapSaleable').value = guess(['saleable','available','stock','qty']);
        document.getElementById('applyMapping').onclick = () => {
          const { matched, unmatched } = applyFill(
            document.getElementById('mapSku').value, document.getElementById('mapSaleable').value);
          const msg = document.getElementById('weeklyMapMsg');
          msg.className = unmatched ? 'msg err' : 'msg ok';
          msg.textContent = `Filled ${matched} row(s)` + (unmatched ? `, ${unmatched} unmatched.` : '.') + ' Review below, then Save.';
        };
      }catch(e){
        body.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`;
      }
    };
    document.getElementById('saveWeekly').onclick = async () => {
      const date = document.getElementById('weekDate').value;
      const items = [];
      document.querySelectorAll('.weekly-row[data-zsku]').forEach(row => {
        const sale = row.querySelector('.w-saleable').value;
        if(sale === '') return;
        items.push({
          zsku: row.dataset.zsku, reportDate: date,
          saleableQty: Number(sale), damagedQty: Number(row.querySelector('.w-damaged').value || 0)
        });
      });
      const msg = document.getElementById('weeklyMsg');
      if(!items.length){ msg.className='msg err'; msg.textContent='Enter at least one saleable qty.'; return; }
      msg.className='msg'; msg.textContent='Saving…';
      try{
        const r = await apiPostBatched('updateNoonWeekly', items, {}, 'updated',
          (done, of) => { if(of > 1){ msg.className='msg'; msg.textContent = `Saving batch ${done}/${of}…`; } });
        msg.className='msg ok'; msg.textContent = `Saved ${r.total} SKU(s).`;
      }
      catch(e){ msg.className='msg err'; msg.textContent = e.message; }
    };
  }catch(e){ setPanel(errorState(e)); }
}

// Status shown here is the "effective" status from v_sales_orders — a
// Scheduled order automatically displays (and chips) as "Delivery" once its
// shipment day has arrived, with no button click needed.
function soStatusChip(status){
  const map = { Open:'gray', Pending:'amber', Confirmed:'blue', Scheduled:'blue', Delivery:'amber',
    'In transit':'amber', 'POD attached':'purple', Delivered:'green', Completed:'green', Cancelled:'red' };
  const cls = map[status] || 'gray';
  return `<span class="chip ${cls}">${status||''}</span>`;
}
// Every display status a Sales Order can show (Scheduled/Delivery are both
// the same raw 'Scheduled' status — see v_sales_orders — just shown as
// whichever the row's actually reading right now).
const SO_STATUSES = ['Open','Pending','Confirmed','Scheduled','Delivery','In transit','POD attached','Delivered','Completed','Cancelled'];

async function renderSalesOrders(){
  state.view = 'salesorders'; state.selectedSO = null; persistView();
  $main.innerHTML = viewHead('Sales Orders', 'Shipments sent to Noon FBN. Click one to view or add its items.') + panelShell('loading');
  try{
    const rows = await apiGet('salesOrder');
    // Newest Creation date first. A plain reverse() (insertion/fetch order)
    // isn't reliably the same thing once rows get edited, so this sorts on
    // the actual ShipDate.
    const sorted = rows.slice().sort((a, b) => (b.ShipDate||'').localeCompare(a.ShipDate||''));
    const statusOptionsHtml = `<option value="">All statuses</option>` + SO_STATUSES.map(s => `<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('');

    const renderRows = (list) => {
      const body = list.length ? list.map(r => `
        <tr class="clickRow" data-so="${r.SONumber}">
          <td class="sku">${r.SONumber}</td>
          <td>${r.ShipDate||''}</td>
          <td>${r.ScheduledDate||'—'}</td>
          <td class="num">${fmt(r.TotalUnitsSent)}</td>
          <td class="num">${fmt(r.TotalConfirmedQty)}</td>
          <td class="num">${fmt(r.TotalDeliveredQty)}</td>
          <td>${soStatusChip(r.Status)}</td>
        </tr>`).join('') : `<tr><td colspan="7">${emptyState('No sales orders match this filter.')}</td></tr>`;
      const tbody = document.getElementById('soListBody');
      if(tbody) tbody.innerHTML = body;
      document.querySelectorAll('tr.clickRow[data-so]').forEach(tr => {
        tr.style.cursor = 'pointer';
        tr.onclick = () => { state.selectedSO = tr.dataset.so; renderSalesOrderDetail(); };
      });
    };

    setPanel(`
      <div class="panel-head"><h3>${rows.length} order${rows.length===1?'':'s'}</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn primary" id="newSOBtn">Create new Sales Order</button>
          <button class="btn" onclick="refreshAll()">Refresh</button>
        </div></div>
      ${rows.length ? `
      <div class="panel-head" style="flex-wrap:wrap;gap:10px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="text" id="soSearchInput" placeholder="Search SO number…" style="width:200px;">
          <select id="soStatusFilter">${statusOptionsHtml}</select>
        </div>
      </div>
      <table>
        <thead><tr><th>SO</th><th>Creation date</th><th>Scheduled</th><th class="num">Planned</th><th class="num">Confirmed</th><th class="num">Delivered</th><th>Status</th></tr></thead>
        <tbody id="soListBody"></tbody></table>` : emptyState('No sales orders yet — click "Create new Sales Order" above.')}
    `);

    if(rows.length){
      const searchInput = document.getElementById('soSearchInput');
      const statusFilter = document.getElementById('soStatusFilter');
      const applyFilter = () => {
        const q = searchInput.value.trim().toLowerCase();
        const statusVal = statusFilter.value;
        // No status picked: everything except Cancelled (hidden by
        // default). Picking "Cancelled" explicitly is the only way to see
        // cancelled orders; picking any other status filters to just that.
        let list = statusVal ? sorted.filter(r => r.Status === statusVal) : sorted.filter(r => r.Status !== 'Cancelled');
        if(q) list = list.filter(r => (r.SONumber||'').toLowerCase().includes(q));
        renderRows(list);
      };
      searchInput.oninput = applyFilter;
      statusFilter.onchange = applyFilter;
      applyFilter();
    }

    document.getElementById('newSOBtn').onclick = openCreateSOModal;
  }catch(e){ setPanel(errorState(e)); }
}

// Small popup asking for the supplier's quotation number (required) — same
// pattern as openScheduleDeliveryModal for the Sales Order screen's "Confirm
// delivery": the button collects what the transition needs right there
// instead of requiring it be entered ahead of time via Edit.
// "Within days" options for Expected receiving date — picking one fills the
// date field from today + N days. Offsets run +1 (Tomorrow) through +7,
// covering every day in between so the date can always be set from the
// dropdown alone without also needing the calendar.
const RECEIVING_WITHIN_DAYS = [
  { label:'Tomorrow', days:1 }, { label:'2 days', days:2 }, { label:'3 days', days:3 },
  { label:'4 days', days:4 }, { label:'5 days', days:5 }, { label:'6 days', days:6 }, { label:'7 days', days:7 },
];
function dateFromToday(days){
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
